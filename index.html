{ id: 15, eng: "We grilled sausages and baked potatoes over the fire.", tr: "Ateşin üzerinde sosis ızgara yaptık ve patates pişirdik." },
{ id: 16, eng: "Food always tastes much better when you cook it outdoors.", tr: "Açık havada pişirdiğinizde yemeklerin tadı her zaman çok daha güzel olur." },
{ id: 17, eng: "Later in the evening, we sat around the fire and shared funny stories.", tr: "Akşamın ilerleyen saatlerinde ateşin etrafında oturduk ve komik hikayeler paylaştık." },
{ id: 18, eng: "Looking up, we could see thousands of bright stars in the dark sky.", tr: "Yukarı baktığımızda, karanlık gökyüzünde binlerce parlak yıldız görebiliyorduk." },
{ id: 19, eng: "During the night, I woke up because I heard unfamiliar animal sounds.", tr: "Gece boyunca tanıdık olmayan hayvan sesleri duyduğum için uyandım." },
{ id: 20, eng: "However, everything was safe, and I fell back asleep quickly.", tr: "Ancak her şey güvendeydi ve hızla yeniden uykuya daldım." },
{ id: 21, eng: "In the morning, we drank hot coffee while watching the sunrise.", tr: "Sabah gün doğumunu izlerken sıcak kahve içtik." },
{ id: 22, eng: "It was one of the most memorable weekends of my life.", tr: "Hayatımın en unutulmaz hafta sonlarından biriydi." }
],

]

{ id: 31, level: 'B1', length: 'long', title: 'The Rise of Renewable Energy',
sentences: [
{ id: 1, eng: "For more than a century, human society has heavily relied on coal, oil, and natural gas.", tr: "Bir asırdan fazla bir süredir insan toplumu yoğun bir şekilde kömür, petrol ve doğal gaza bağımlı olmuştur." },
{ id: 2, eng: "These fossil fuels have powered our cities, factories, and transportation networks.", tr: "Bu fosil yakıtlar şehirlerimize, fabrikalarımıza ve ulaşım ağlarımıza güç sağlamıştır." },
{ id: 3, eng: "However, burning fossil fuels produces massive amounts of greenhouse gases.", tr: "Ancak fosil yakıtların yakılması muazzam miktarda sera gazı üretir." },
{ id: 4, eng: "These emissions trap heat in the atmosphere and accelerate global climate change.", tr: "Bu salınımlar ısıyı atmosferde hapseder ve küresel iklim değişikliğini hızlandırır." },
{ id: 5, eng: "In recent decades, many countries have started investing heavily in renewable energy sources.", tr: "Son yıllarda birçok ülke yenilenebilir enerji kaynaklarına yoğun yatırımlar yapmaya başladı." },
{ id: 6, eng: "Solar power is currently one of the fastest-growing clean energy sectors in the world.", tr: "Güneş enerjisi şu anda dünyadaki en hızlı büyüyen temiz enerji sektörlerinden biridir." },
{ id: 7, eng: "Solar panels convert natural sunlight directly into electrical energy without creating pollution.", tr: "Güneş panelleri, doğal güneş ışığını kirlilik yaratmadan doğrudan elektrik enerjisine dönüştürür." },
{ id: 8, eng: "The manufacturing cost of solar panels has decreased dramatically over the last ten years.", tr: "Güneş panellerinin üretim maliyeti son on yılda çarpıcı bir şekilde azaldı." },
{ id: 9, eng: "Wind energy is another powerful alternative that generates clean electricity on a large scale.", tr: "Rüzgar enerjisi, büyük ölçekte temiz elektrik üreten bir diğer güçlü alternatiftir." },
{ id: 10, eng: "Giant wind turbines are placed on open hills or installed off ocean coasts.", tr: "Dev rüzgar türbinleri açık tepelere yerleştirilir veya okyanus kıyılarının açığına kurulur." },
{ id: 11, eng: "Offshore wind farms take advantage of strong and steady ocean winds.", tr: "Açık deniz rüzgar çiftlikleri, güçlü ve istikrarlı okyanus rüzgarlarından faydalanır." },
{ id: 12, eng: "Hydroelectric power is also widely used in mountainous areas with flowing rivers.", tr: "Hidroelektrik enerjisi de akan nehirleri olan dağlık bölgelerde yaygın olarak kullanılmaktadır." },
{ id: 13, eng: "Despite these advantages, renewable energy systems face some critical technical challenges.", tr: "Bu avantajlara rağmen yenilenebilir enerji sistemleri bazı kritik teknik zorluklarla karşı karşıyadır." },
{ id: 14, eng: "Solar panels cannot generate electricity at night, and wind turbines stop when there is no wind.", tr: "Güneş panelleri geceleri elektrik üretemez ve rüzgar olmadığında rüzgar türbinleri durur." },
{ id: 15, eng: "This variability means that energy storage systems are essential for reliability.", tr: "Bu değişkenlik, enerji depolama sistemlerinin güvenilirlik için vazgeçilmez olduğu anlamına gelir." },
{ id: 16, eng: "Engineers are developing large-scale lithium-ion and sodium batteries to store excess power.", tr: "Mühendisler, fazla enerjiyi depolamak için büyük ölçekli lityum-iyon ve sodyum piller geliştiriyor." },
{ id: 17, eng: "When the sun is shining brightly, surplus electricity is stored in these battery systems.", tr: "Güneş parlak bir şekilde parlarken, fazla elektrik bu pil sistemlerinde depolanır." },
{ id: 18, eng: "Later, the stored energy is released into the electrical grid during peak evening hours.", tr: "Daha sonra depolanan enerji, yoğun akşam saatlerinde elektrik şebekesine verilir." },
{ id: 19, eng: "Modernizing the power grid is another necessary step for managing distributed energy.", tr: "Elektrik şebekesini modernize etmek, dağıtılmış enerjiyi yönetmek için gerekli bir diğer adımdır." },
{ id: 20, eng: "Smart grids use digital sensors to distribute electricity efficiently across regions.", tr: "Akıllı şebekeler, elektriği bölgeler arasında verimli bir şekilde dağıtmak için dijital sensörler kullanır." },
{ id: 21, eng: "Many governments now provide tax incentives to encourage homeowners to install solar panels.", tr: "Artık birçok hükümet, ev sahiplerini güneş paneli kurmaya teşvik etmek için vergi teşvikleri sağlıyor." },
{ id: 22, eng: "In addition, transitioning to green energy creates millions of high-tech jobs worldwide.", tr: "Ayrıca yeşil enerjiye geçiş dünya çapında milyonlarca yüksek teknolojili iş imkanı yaratıyor." },
{ id: 23, eng: "Electric vehicles are also becoming common, reducing our dependence on imported petroleum.", tr: "Elektrikli araçlar da yaygınlaşarak ithal petrole olan bağımlılığımızı azaltıyor." },
{ id: 24, eng: "If nations work together, clean energy can replace most fossil fuels within our lifetime.", tr: "Uluslar birlikte çalışırsa, temiz enerji yaşam süremiz içinde çoğu fosil yakıtın yerini alabilir." },
{ id: 25, eng: "A cleaner and greener future depends on the investments and choices we make today.", tr: "Daha temiz ve daha yeşil bir gelecek, bugün yaptığımız yatırımlara ve seçimlere bağlıdır." }
],
questions: [
{ q: "Why are energy storage systems essential for renewable energy?", options: ["Because solar and wind energy are variable", "Because batteries look nice", "To make electricity more expensive"], answer: 0 },
{ q: "Where are offshore wind farms typically installed?", options: ["In deep caves", "Off ocean coasts", "Inside large warehouses"], answer: 1 },
{ q: "How do smart grids improve electricity distribution?", options: ["By using digital sensors", "By shutting down factories", "By burning extra coal"], answer: 0 }
]
},
{ id: 32, level: 'B1', length: 'long', title: 'The Psychology of Habit Formation',
sentences: [
{ id: 1, eng: "Almost half of our daily actions are driven by automatic habits rather than conscious decisions.", tr: "Günlük eylemlerimizin neredeyse yarısı, bilinçli kararlardan ziyade otomatik alışkanlıklar tarafından yönlendirilir." },
{ id: 2, eng: "When you wake up, brush your teeth, or check your phone, your brain is following a routine.", tr: "Uyandığınızda, dişlerinizi fırçaladığınızda veya telefonunuzu kontrol ettiğinizde beyniniz bir rutini takip eder." },
{ id: 3, eng: "Habits exist because the human brain is always looking for ways to save effort and energy.", tr: "Alışkanlıklar vardır çünkü insan beyni her zaman çaba ve enerji tasarrufu yapmanın yollarını arar." },
{ id: 4, eng: "Scientists have discovered that every habit follows a three-step neurological loop.", tr: "Bilim insanları her alışkanlığın üç adımlı nörolojik bir döngüyü takip ettiğini keşfettiler." },
{ id: 5, eng: "The first stage of this loop is the cue, which acts as a trigger for your behavior.", tr: "Bu döngünün ilk aşaması, davranışınız için bir tetikleyici görevi gören ipucudur." },
{ id: 6, eng: "A cue can be a specific time of day, a physical location, or an emotional state like stress.", tr: "Bir ipucu günün belirli bir saati, fiziksel bir konum veya stres gibi duygusal bir durum olabilir." },
{ id: 7, eng: "The second stage is the routine, which is the actual physical or mental action you perform.", tr: "İkinci aşama, gerçekleştirdiğiniz gerçek fiziksel veya zihinsel eylem olan rutindir." },
{ id: 8, eng: "The third stage is the reward, which tells your brain that this action is worth remembering.", tr: "Üçüncü aşama, beyninize bu eylemin hatırlanmaya değer olduğunu söyleyen ödüldür." },
{ id: 9, eng: "For example, feeling tired in the afternoon acts as a cue to drink a cup of coffee.", tr: "Örneğin, öğleden sonra yorgun hissetmek bir fincan kahve içmek için bir ipucu görevi görür." },
{ id: 10, eng: "The routine is walking to the kitchen and preparing the coffee.", tr: "Rutin, mutfağa yürümek ve kahveyi hazırlamaktır." },
{ id: 11, eng: "The reward is the boost of energy and pleasant taste that follows shortly after.", tr: "Ödül, hemen ardından gelen enerji artışı ve hoş tattır." },
{ id: 12, eng: "If this pattern is repeated frequently, a strong neurological pathway forms in the brain.", tr: "Bu kalıp sık sık tekrarlanırsa, beyinde güçlü bir nörolojik yol oluşur." },
{ id: 13, eng: "Trying to eliminate an unwanted habit through pure willpower alone is rarely effective.", tr: "İstenmeyen bir alışkanlığı yalnızca saf irade gücüyle ortadan kaldırmaya çalışmak nadiren etkilidir." },
{ id: 14, eng: "Instead, behavioral psychologists suggest keeping the same cue and reward while changing the routine.", tr: "Bunun yerine davranış psikologları, rutini değiştirirken aynı ipucunu ve ödülü korumayı önerir." },
{ id: 15, eng: "If stress makes you eat unhealthy snacks, you can replace the snacking with a short walk.", tr: "Stres sağlıksız atıştırmalıklar yemenize neden oluyorsa, atıştırmayı kısa bir yürüyüşle değiştirebilirsiniz." },
{ id: 16, eng: "The walk provides a similar relief from stress without the negative physical consequences.", tr: "Yürüyüş, olumsuz fiziksel sonuçlar olmadan stresten benzer bir rahatlama sağlar." },
{ id: 17, eng: "When building positive new habits, starting with extremely small actions is recommended.", tr: "Olumlu yeni alışkanlıklar edinirken, son derece küçük eylemlerle başlamak önerilir." },
{ id: 18, eng: "For instance, reading just two pages of a book every night is an easy commitment.", tr: "Örneğin her gece bir kitabın sadece iki sayfasını okumak kolay bir taahhüttür." },
{ id: 19, eng: "Small habits are easy to maintain because they do not require high levels of motivation.", tr: "Küçük alışkanlıkları sürdürmek kolaydır çünkü yüksek düzeyde motivasyon gerektirmezler." },
{ id: 20, eng: "Over time, these small actions compound into significant personal and professional growth.", tr: "Zamanla bu küçük eylemler katlanarak önemli kişisel ve profesyonel gelişime dönüşür." },
{ id: 21, eng: "Your physical environment also plays a vital role in shaping your everyday routines.", tr: "Fiziksel çevreniz de günlük rutinlerinizi şekillendirmede hayati bir rol oynar." },
{ id: 22, eng: "If you want to exercise in the morning, place your gym clothes right next to your bed.", tr: "Sabahları spor yapmak istiyorsanız, spor kıyafetlerinizi doğrudan yatağınızın yanına koyun." },
{ id: 23, eng: "Removing temptations from your sight makes it much easier to avoid bad habits.", tr: "Ayartıcı unsurları görüş alanınızdan kaldırmak, kötü alışkanlıklardan kaçınmayı çok daha kolaylaştırır." },
{ id: 24, eng: "Consistency is far more important than intensity when establishing long-term behavioral changes.", tr: "Uzun vadeli davranış değişiklikleri oluştururken tutarlılık, yoğunluktan çok daha önemlidir." },
{ id: 25, eng: "By mastering your daily habits, you gain the power to design your own future.", tr: "Günlük alışkanlıklarınızda ustalaşarak kendi geleceğinizi tasarlama gücünü kazanırsınız." }
],
questions: [
{ q: "What are the three stages of the habit loop?", options: ["Cue, routine, reward", "Plan, action, result", "Start, middle, finish"], answer: 0 },
{ q: "Why is starting with very small habits recommended?", options: ["They do not require high motivation", "They cost less money", "They can be done while sleeping"], answer: 0 },
{ q: "What is more important than intensity when building habits?", options: ["Speed", "Consistency", "Strictness"], answer: 1 }
]
},
{ id: 33, level: 'B1', length: 'long', title: 'Sustainable Tourism and Travel',
sentences: [
{ id: 1, eng: "International tourism has grown rapidly over the past few decades, connecting people across the globe.", tr: "Uluslararası turizm son birkaç on yılda hızla büyüyerek dünya çapındaki insanları birbirine bağladı." },
{ id: 2, eng: "Traveling allows us to explore foreign cultures, taste unique cuisines, and admire historical monuments.", tr: "Seyahat etmek yabancı kültürleri keşfetmemizi, benzersiz lezzetleri tatmamızı ve tarihi anıtlara hayran kalmamızı sağlar." },
{ id: 3, eng: "However, the rise of mass tourism has created severe environmental and social problems.", tr: "Ancak kitle turizminin yükselişi ciddi çevresel ve sosyal sorunlar yaratmıştır." },
{ id: 4, eng: "Popular destinations often suffer from overtourism, where visitor numbers exceed local capacity.", tr: "Popüler destinasyonlar genellikle ziyaretçi sayısının yerel kapasiteyi aştığı aşırı turizmden muzdariptir." },
{ id: 5, eng: "Historic cities like Venice and Amsterdam face overcrowded streets and rising housing prices.", tr: "Venedik ve Amsterdam gibi tarihi şehirler aşırı kalabalık sokaklar ve artan konut fiyatlarıyla karşı karşıyadır." },
{ id: 6, eng: "Local residents are sometimes forced to move away because landlords turn apartments into tourist rentals.", tr: "Yerel sakinler bazen ev sahipleri daireleri turist kiralıklarına dönüştürdüğü için taşınmak zorunda kalıyor." },
{ id: 7, eng: "In natural areas, heavy foot traffic can damage fragile ecosystems and disturb wild animals.", tr: "Doğal alanlarda yoğun yaya trafiği kırılgan ekosistemlere zarar verebilir ve vahşi hayvanları rahatsız edebilir." },
{ id: 8, eng: "In response to these growing concerns, the concept of sustainable tourism has emerged.", tr: "Giderek artan bu endişelere yanıt olarak sürdürülebilir turizm kavramı ortaya çıkmıştır." },
{ id: 9, eng: "Sustainable tourism aims to minimize negative impacts while maximizing benefits for local communities.", tr: "Sürdürülebilir turizm, yerel topluluklar için faydaları en üst düzeye çıkarırken olumsuz etkileri en aza indirmeyi amaçlar." },
{ id: 10, eng: "Responsible travelers can make a meaningful difference by adopting eco-friendly travel practices.", tr: "Sorumlu gezginler, çevre dostu seyahat uygulamalarını benimseyerek anlamlı bir fark yaratabilirler." },
{ id: 11, eng: "First, choosing public transportation like trains instead of short flights reduces carbon emissions.", tr: "İlk olarak kısa uçuşlar yerine tren gibi toplu taşıma araçlarını seçmek karbon emisyonlarını azaltır." },
{ id: 12, eng: "Trains offer scenic views and are often much more comfortable than sitting in crowded airports.", tr: "Trenler manzaralı görüntüler sunar ve genellikle kalabalık havaalanlarında oturmaktan çok daha konforludur." },
{ id: 13, eng: "Second, supporting locally owned hotels and restaurants ensures that your money benefits the community.", tr: "İkinci olarak yerel işletmelere ait otel ve restoranları desteklemek, paranızın topluluğa fayda sağlamasını garantiler." },
{ id: 14, eng: "Large multinational resort chains often transfer their profits out of the destination country.", tr: "Büyük çok uluslu tatil köyü zincirleri karlarını genellikle destinasyon ülkesinin dışına aktarırlar." },
{ id: 15, eng: "In contrast, eating at local family-run eateries supports small business owners directly.", tr: "Buna karşılık, yerel aile işletmesi lokantalarda yemek yemek küçük işletme sahiplerini doğrudan destekler." },
{ id: 16, eng: "Respecting local cultural traditions and dress codes is another fundamental ethical duty.", tr: "Yerel kültürel geleneklere ve giyim kurallarına saygı duymak bir diğer temel ahlaki görevdir." },
{ id: 17, eng: "Before traveling to a new country, learning a few basic phrases in the local language is polite.", tr: "Yeni bir ülkeye seyahat etmeden önce yerel dilde birkaç temel ifade öğrenmek kibar bir davranıştır." },
{ id: 18, eng: "In fragile natural parks, travelers should always follow the rule of leaving no trace.", tr: "Kırılgan milli parklarda gezginler her zaman geride hiçbir iz bırakmama kuralına uymalıdır." },
{ id: 19, eng: "This means carrying all your trash back with you and never removing rocks, flowers, or shells.", tr: "Bu, tüm çöplerinizi yanınızda geri taşımak ve kayaları, çiçekleri veya deniz kabuklarını asla almamak anlamına gelir." },
{ id: 20, eng: "Avoiding plastic bottles by carrying a reusable water container helps reduce plastic pollution.", tr: "Yeniden kullanılabilir bir su kabı taşıyarak plastik şişelerden kaçınmak, plastik kirliliğini azaltmaya yardımcı olur." },
{ id: 21, eng: "Travelers can also visit lesser-known towns rather than only popular tourist hotspots.", tr: "Gezginler sadece popüler turistik noktalar yerine daha az bilinen kasabaları da ziyaret edebilirler." },
{ id: 22, eng: "Traveling during the off-season reduces pressure on local infrastructure and offers a quieter experience.", tr: "Sezon dışı seyahat etmek yerel altyapı üzerindeki baskıyı azaltır ve daha sakin bir deneyim sunar." },
{ id: 23, eng: "Off-season travel is also significantly cheaper, saving you money on flights and lodging.", tr: "Sezon dışı seyahat aynı zamanda önemli ölçüde daha ucuzdur; uçuşlar ve konaklamada tasarruf etmenizi sağlar." },
{ id: 24, eng: "Mindful travel helps protect natural wonders and heritage sites for future generations to enjoy.", tr: "Bilinçli seyahat, gelecek nesillerin keyif alabilmesi için doğa harikalarını ve miras alanlarını korumaya yardımcı olur." },
{ id: 25, eng: "When we travel with respect and curiosity, we become global ambassadors of peace and empathy.", tr: "Saygı ve merakla seyahat ettiğimizde, küresel barış ve empati elçileri haline geliriz." }
],
questions: [
{ q: "What is a major problem caused by overtourism in historic cities?", options: ["Streets become too quiet", "Rising housing prices for locals", "Too many wild animals"], answer: 1 },
{ q: "Why is eating at locally owned eateries beneficial?", options: ["It supports small business owners directly", "It is always free", "It takes less time to eat"], answer: 0 },
{ q: "What does the 'leave no trace' rule mean?", options: ["Never taking photos", "Carrying all trash back and leaving nature undisturbed", "Walking without shoes"], answer: 1 }
]
},
{ id: 34, level: 'B1', length: 'long', title: 'The Art of Public Speaking',
sentences: [
{ id: 1, eng: "Public speaking is frequently ranked as one of the most common fears among adults worldwide.", tr: "Topluluk önünde konuşma, dünya çapındaki yetişkinler arasında en yaygın korkulardan biri olarak sıklıkla üst sıralarda yer alır." },
{ id: 2, eng: "This fear of speaking in front of an audience is known scientifically as glossophobia.", tr: "Bir dinleyici kitlesi önünde konuşma korkusu bilimsel olarak glossofobi olarak bilinir." },
{ id: 3, eng: "When standing before a crowd, the human nervous system often triggers a fight-or-flight response.", tr: "Bir kalabalığın önünde dururken, insan sinir sistemi sıklıkla bir savaş ya da kaç tepkisini tetikler." },
{ id: 4, eng: "Your heart beats faster, your palms sweat, and your voice may begin to tremble slightly.", tr: "Kalbiniz daha hızlı çarpar, avuçlarınız terler ve sesiniz hafifçe titremeye başlayabilir." },
{ id: 5, eng: "Despite this natural anxiety, effective public speaking is a skill that anyone can develop with practice.", tr: "Bu doğal kaygıya rağmen, etkili topluluk önünde konuşma herkesin pratikle geliştirebileceği bir beceridir." },
{ id: 6, eng: "The most crucial factor in delivering a successful speech is thorough preparation.", tr: "Başarılı bir konuşma yapmanın en önemli faktörü kapsamlı bir hazırlıktır." },
{ id: 7, eng: "Knowing your topic deeply gives you confidence and prevents you from panicking on stage.", tr: "Konunuzu derinlemesine bilmek size özgüven verir ve sahnede paniklemenizi engeller." },
{ id: 8, eng: "You should always research your audience to understand their expectations, background, and interests.", tr: "Beklentilerini, geçmişlerini ve ilgi alanlarını anlamak için her zaman dinleyici kitlenizi araştırmalısınız." },
{ id: 9, eng: "A speech should have a clear structure: an engaging introduction, a solid body, and a memorable conclusion.", tr: "Bir konuşmanın net bir yapısı olmalıdır: ilgi çekici bir giriş, sağlam bir gövde ve akılda kalıcı bir sonuç." },
{ id: 10, eng: "Opening with an interesting question, a surprising fact, or a personal story captures immediate attention.", tr: "İlginç bir soruyla, şaşırtıcı bir gerçekle veya kişisel bir hikayeyle başlamak anında dikkat çeker." },
{ id: 11, eng: "Audiences rarely remember raw statistics, but they remember emotionally compelling human stories.", tr: "Dinleyiciler ham istatistikleri nadiren hatırlar ama duygusal olarak etkileyici insan hikayelerini hatırlarlar." },
{ id: 12, eng: "Body language is just as important as the spoken words in communicating your message.", tr: "Beden dili, mesajınızı iletmede konuşulan kelimeler kadar önemlidir." },
{ id: 13, eng: "Standing upright with relaxed shoulders projects authority, confidence, and trustworthiness.", tr: "Rahat omuzlarla dik durmak otorite, güven ve güvenilirlik yansıtır." },
{ id: 14, eng: "Making steady eye contact with different sections of the room helps build a personal connection.", tr: "Odanın farklı bölümleriyle düzenli göz teması kurmak kişisel bir bağ kurmaya yardımcı olur." },
{ id: 15, eng: "Avoid crossing your arms or hiding your hands in your pockets, as this creates a defensive impression.", tr: "Kollarınızı kavuşturmaktan veya ellerinizi ceplerinize saklamaktan kaçının çünkü bu savunmacı bir izlenim yaratır." },
{ id: 16, eng: "Controlling your vocal delivery is another essential element of public speaking mastery.", tr: "Sesinizi kontrol etmek, topluluk önünde konuşma ustalığının bir diğer temel unsurudur." },
{ id: 17, eng: "Speaking too quickly is a common mistake caused by nervousness and adrenaline.", tr: "Çok hızlı konuşmak, gerginlik ve adrenalinin neden olduğu yaygın bir hatadır." },
{ id: 18, eng: "Deliberate pauses allow the audience to absorb important points and give you time to breathe.", tr: "Bilinçli duraklamalar, dinleyicilerin önemli noktaları kavramasını sağlar ve size nefes alacak zaman tanır." },
{ id: 19, eng: "Varying your tone and pitch keeps the audience engaged and prevents your speech from sounding monotonous.", tr: "Tonunuzu ve ses perdenizi çeşitlendirmek dinleyicilerin ilgisini canlı tutar ve konuşmanızın tekdüze çıkmasını önler." },
{ id: 20, eng: "Visual aids, such as presentation slides, should be simple, clean, and free of long text paragraphs.", tr: "Sunum slaytları gibi görsel yardımcılar basit, temiz ve uzun metin paragraflarından arındırılmış olmalıdır." },
{ id: 21, eng: "Slides should complement your spoken words rather than serve as a script for you to read.", tr: "Slaytlar okumanız için bir metin işlevi görmek yerine konuşulan kelimelerinizi tamamlamalıdır." },
{ id: 22, eng: "Practicing your speech out loud multiple times in front of a mirror or friend reduces anxiety significantly.", tr: "Konuşmanızı bir ayna veya arkadaşınızın önünde defalarca sesli olarak çalışmak kaygıyı önemli ölçüde azaltır." },
{ id: 23, eng: "Recording your presentation on your smartphone allows you to identify filler words like 'um' and 'uh'.", tr: "Sunumunuzu akıllı telefonunuza kaydetmek 'ııı' ve 'şey' gibi dolgu kelimeleri belirlemenizi sağlar." },
{ id: 24, eng: "With continuous practice and constructive feedback, public speaking transforms from a terrifying ordeal into a rewarding opportunity.", tr: "Sürekli pratik ve yapıcı geri bildirimle, topluluk önünde konuşma korkutucu bir çileden tatmin edici bir fırsata dönüşür." },
{ id: 25, eng: "Strong communication skills empower you to share your ideas, inspire others, and advance your career.", tr: "Güçlü iletişim becerileri fikirlerinizi paylaşmanız, başkalarına ilham vermeniz ve kariyerinizde ilerlemeniz için size güç verir." }
],
questions: [
{ q: "What is glossophobia?", options: ["Fear of flying", "Fear of public speaking", "Fear of closed spaces"], answer: 1 },
{ q: "Why should a speaker make deliberate pauses?", options: ["To let the audience absorb points and breathe", "To check the clock", "To drink a full glass of water"], answer: 0 },
{ q: "How should presentation slides be designed?", options: ["Full of long paragraphs", "Simple, clean, and complementary", "With tiny, unreadable fonts"], answer: 1 }
]
},
{ id: 35, level: 'B1', length: 'long', title: 'Financial Literacy for Young Adults',
sentences: [
{ id: 1, eng: "Financial literacy is one of the most vital life skills, yet it is rarely taught in regular school curriculums.", tr: "Finansal okuryazarlık en hayati yaşam becerilerinden biridir, ancak normal okul müfredatlarında nadiren öğretilir." },
{ id: 2, eng: "Many young adults enter university or the workforce without knowing how to manage their money effectively.", tr: "Birçok genç yetişkin, paralarını nasıl etkili bir şekilde yöneteceklerini bilmeden üniversiteye veya iş gücüne girer." },
{ id: 3, eng: "As a result, they often fall into unnecessary debt, make poor investment choices, and suffer financial stress.", tr: "Sonuç olarak sıklıkla gereksiz borçlara girerler, kötü yatırım seçimleri yaparlar ve finansal stres yaşarlar." },
{ id: 4, eng: "Developing healthy financial habits early in life creates long-term financial security and freedom.", tr: "Hayatın erken dönemlerinde sağlıklı finansal alışkanlıklar geliştirmek, uzun vadeli finansal güvenlik ve özgürlük yaratır." },
{ id: 5, eng: "The foundation of personal financial management begins with creating a realistic monthly budget.", tr: "Kişisel finans yönetiminin temeli, gerçekçi bir aylık bütçe oluşturmakla başlar." },
{ id: 6, eng: "A budget allows you to track where your income comes from and where every single dollar goes.", tr: "Bir bütçe gelirinizin nereden geldiğini ve her bir liranın nereye gittiğini takip etmenizi sağlar." },
{ id: 7, eng: "A popular and effective budgeting method is known as the 50/30/20 rule.", tr: "Popüler ve etkili bir bütçeleme yöntemi 50/30/20 kuralı olarak bilinir." },
{ id: 8, eng: "According to this rule, 50 percent of your after-tax income should cover essential needs like rent, groceries, and utilities.", tr: "Bu kurala göre, vergi sonrası gelirinizin yüzde 50'si kira, market ve faturalar gibi temel ihtiyaçları karşılamalıdır." },
{ id: 9, eng: "30 percent can be allocated to personal wants, such as dining out, hobbies, and entertainment.", tr: "Yüzde 30'u dışarıda yemek, hobiler ve eğlence gibi kişisel isteklere ayrılabilir." },
{ id: 10, eng: "The remaining 20 percent should be dedicated strictly to debt repayment, savings, and investments.", tr: "Kalan yüzde 20'si ise kesinlikle borç geri ödemesine, tasarruflara ve yatırımlara ayrılmalıdır." },
{ id: 11, eng: "Building an emergency fund is the first financial milestone every young adult should achieve.", tr: "Bir acil durum fonu oluşturmak, her genç yetişkinin ulaşması gereken ilk finansal kilometre taşıdır." },
{ id: 12, eng: "An emergency fund consists of three to six months' worth of basic living expenses kept in a safe bank account.", tr: "Acil durum fonu, güvenli bir banka hesabında tutulan üç ila altı aylık temel yaşam masraflarından oluşur." },
{ id: 13, eng: "This money provides a safety net during unexpected events like medical emergencies or sudden job loss.", tr: "Bu para tıbbi acil durumlar veya ani iş kaybı gibi beklenmedik olaylar sırasında bir güvenlik ağı sağlar." },
{ id: 14, eng: "Another crucial lesson in financial literacy is avoiding high-interest consumer debt.", tr: "Finansal okuryazarlıktaki bir diğer önemli ders, yüksek faizli tüketici borçlarından kaçınmaktır." },
{ id: 15, eng: "Credit cards offer convenient rewards, but carrying a balance from month to month generates high interest charges.", tr: "Kredi kartları kullanışlı ödüller sunar, ancak aydan aya bakiye devretmek yüksek faiz giderleri doğurur." },
{ id: 16, eng: "Paying off your credit card balance in full every single month prevents debt from accumulating rapidly.", tr: "Kredi kartı bakiyenizi her ay tam olarak ödemek, borcun hızla birikmesini önler." },
{ id: 17, eng: "Understanding the power of compound interest is essential for building wealth over time.", tr: "Bileşik faizin gücünü anlamak zamanla zenginlik inşa etmek için esastır." },
{ id: 18, eng: "Compound interest occurs when the interest earned on your money begins earning its own interest.", tr: "Bileşik faiz, paranızdan kazanılan faizin kendi faizini kazanmaya başlamasıyla gerçekleşir." },
{ id: 19, eng: "Albert Einstein reportedly called compound interest the eighth wonder of the modern world.", tr: "Albert Einstein'ın bileşik faizi modern dünyanın sekizinci harikası olarak adlandırdığı söylenir." },
{ id: 20, eng: "The earlier you start investing, the more time your money has to grow exponentially.", tr: "Yatırım yapmaya ne kadar erken başlarsanız, paranızın katlanarak büyümesi için o kadar çok zamanı olur." },
{ id: 21, eng: "Investing in diversified low-cost index funds is often recommended for long-term passive investors.", tr: "Çeşitlendirilmiş düşük maliyetli endeks fonlarına yatırım yapmak, uzun vadeli pasif yatırımcılar için sıklıkla önerilir." },
{ id: 22, eng: "It is important to distinguish between assets that gain value and liabilities that cost you money.", tr: "Değer kazanan varlıklar ile size para harcatan yükümlülükler arasında ayrım yapmak önemlidir." },
{ id: 23, eng: "A vehicle loses value immediately after purchase, while quality investments generate passive income.", tr: "Bir araç satın alındıktan hemen sonra değer kaybederken, kaliteli yatırımlar pasif gelir üretir." },
{ id: 24, eng: "Financial education requires discipline, continuous learning, and delayed gratification.", tr: "Finansal eğitim disiplin, sürekli öğrenme ve ertelemeli doyum gerektirir." },
{ id: 25, eng: "By taking control of your personal finances today, you build a prosperous and stress-free tomorrow.", tr: "Bugün kişisel finansınızın kontrolünü ele alarak müreffeh ve stressiz bir yarın inşa edersiniz." }
],
questions: [
{ q: "In the 50/30/20 rule, what does the 20% represent?", options: ["Vacations", "Debt repayment, savings, and investments", "Restaurants and clothing"], answer: 1 },
{ q: "How many months of expenses should an emergency fund ideally cover?", options: ["One week", "Three to six months", "Five years"], answer: 1 },
{ q: "What did Albert Einstein allegedly call compound interest?", options: ["A dangerous trap", "The eighth wonder of the world", "A useless formula"], answer: 1 }
]
},

{ id: 26, level: 'B2', length: 'long', title: 'The Psychology of Decision Fatigue',
sentences: [
{ id: 1, eng: "Throughout each day, human beings are confronted with hundreds of decisions ranging from trivial choices to life-altering dilemmas.", tr: "Her gün boyunca insanlar, önemsiz seçimlerden hayat değiştiren ikilemlere kadar yüzlerce kararla karşı karşıya kalırlar." },
{ id: 2, eng: "Psychologists refer to the deteriorating quality of decisions made after a long session of decision-making as decision fatigue.", tr: "Psikologlar, uzun bir karar verme sürecinin ardından verilen kararların kalitesinin düşmesini karar yorgunluğu olarak adlandırırlar." },
{ id: 3, eng: "Unlike physical fatigue, mental exhaustion caused by making continuous choices often goes unnoticed until significant errors occur.", tr: "Fiziksel yorgunluğun aksine, sürekli seçim yapmanın neden olduğu zihinsel tükenmişlik, büyük hatalar ortaya çıkana kadar genellikle fark edilmez." },
{ id: 4, eng: "When willpower is depleted, individuals tend to take shortcuts, either by acting impulsively or by avoiding choices altogether.", tr: "İrade gücü tükendiğinde, bireyler ya dürtüsel hareket ederek ya da seçimlerden tamamen kaçınarak kestirme yollara başvurma eğilimi gösterirler." },
{ id: 5, eng: "A classic study on judicial rulings revealed that judges were significantly more likely to grant parole early in the morning.", tr: "Yargı kararları üzerine yapılan klasik bir araştırma, yargıçların sabahın erken saatlerinde şartlı tahliye verme olasılıklarının çok daha yüksek olduğunu ortaya koydu." },
{ id: 6, eng: "As hours passed and mental energy diminished, the likelihood of an inmate receiving parole dropped dramatically.", tr: "Saatler geçtikçe ve zihinsel enerji azaldıkça, bir mahkumun şartlı tahliye alma olasılığı çarpıcı bir şekilde düştü." },
{ id: 7, eng: "Furthermore, consumer behavior illustrates how retailers exploit this cognitive vulnerability in everyday environments.", tr: "Dahası, tüketici davranışları perakendecilerin günlük ortamlarda bu bilişsel kırılganlığı nasıl istismar ettiğini gösterir." },
{ id: 8, eng: "Supermarkets strategically place sweets, sodas, and impulse buys near the checkout counters where shoppers wait.", tr: "Süpermarketler tatlıları, gazlı içecekleri ve anlık satın alma ürünlerini stratejik olarak müşterilerin beklediği kasa yanlarına yerleştirir." },
{ id: 9, eng: "Having navigated crowded aisles and compared countless prices, tired shoppers are far more prone to giving in to temptation.", tr: "Kalabalık koridorlarda dolaşıp sayısız fiyatı karşılaştıran yorgun müşteriler, ayartmalara yenik düşmeye çok daha meyillidir." },
{ id: 10, eng: "Decision fatigue also severely undermines productivity in corporate and professional environments.", tr: "Karar yorgunluğu ayrıca kurumsal ve profesyonel ortamlarda verimliliği de ciddi şekilde baltalar." },
{ id: 11, eng: "Executives who spend hours answering trivial emails often lack the analytical clarity needed for high-stakes strategic planning.", tr: "Önemsiz e-postaları yanıtlamak için saatler harcayan yöneticiler, genellikle yüksek riskli stratejik planlama için gereken analitik netlikten yoksundur." },
{ id: 12, eng: "Several prominent entrepreneurs, such as Steve Jobs and Mark Zuckerberg, famously adopted monotonous wardrobes to eliminate wardrobe dilemmas.", tr: "Steve Jobs ve Mark Zuckerberg gibi bazı önde gelen girişimciler, gardırop ikilemlerini ortadan kaldırmak için tekdüze kıyafet tarzını benimsemeleriyle ünlüdür." },
{ id: 13, eng: "By automating insignificant daily routines, they preserved their cognitive bandwidth for complex problem-solving later in the day.", tr: "Önemsiz günlük rutinleri otomatikleştirerek, günün ilerleyen saatlerindeki karmaşık problem çözümleri için bilişsel kapasitelerini korudular." },
{ id: 14, eng: "Establishing structured habits is widely considered one of the most effective strategies to counteract this phenomenon.", tr: "Yapılandırılmış alışkanlıklar geliştirmek, bu fenomene karşı koymak için en etkili stratejilerden biri olarak kabul edilir." },
{ id: 15, eng: "When a behavior becomes habitual, the brain operates on automated pathways rather than deliberate cognitive effort.", tr: "Bir davranış alışkanlık haline geldiğinde, beyin kasıtlı bilişsel çaba yerine otomatik yollar üzerinden çalışır." },
{ id: 16, eng: "Another practical technique involves prioritizing demanding intellectual tasks during peak morning hours.", tr: "Diğer bir pratik teknik, zorlu entelektüel görevleri sabahın en verimli saatlerinde önceliklendirmeyi içerir." },
{ id: 17, eng: "Postponing critical negotiations or financial planning until late in the evening frequently leads to sub-optimal outcomes.", tr: "Kritik müzakereleri veya finansal planlamayı akşam geç saatlere ertelemek sıklıkla idealin altında sonuçlara yol açar." },
{ id: 18, eng: "In addition, adequate nutrition and stable blood glucose levels play a crucial role in maintaining executive function.", tr: "Ayrıca yeterli beslenme ve dengeli kan şekeri seviyeleri, yürütücü işlevlerin sürdürülmesinde çok önemli bir rol oynar." },
{ id: 19, eng: "Research confirms that the prefrontal cortex consumes substantial glucose while engaging in self-control and analytical reasoning.", tr: "Araştırmalar, prefrontal korteksin özdenetim ve analitik akıl yürütmeyle meşgul olurken önemli miktarda glikoz tükettiğini doğrulamaktadır." },
{ id: 20, eng: "Taking brief breaks and having a light, protein-rich snack can restore cognitive endurance when working on exhausting projects.", tr: "Yorucu projeler üzerinde çalışırken kısa molalar vermek ve hafif, protein açısından zengin bir atıştırmalık tüketmek bilişsel dayanıklılığı geri kazandırabilir." },
{ id: 21, eng: "Delegating minor responsibilities to colleagues or team members also protects leadership personnel from cognitive overload.", tr: "Küçük sorumlulukları meslektaşlara veya ekip üyelerine devretmek, liderlik personelini bilişsel aşırı yüklenmeden de korur." },
{ id: 22, eng: "In personal life, simplifying daily meal choices through weekly meal prep can free up surprising amounts of mental clarity.", tr: "Kişisel yaşamda, haftalık yemek hazırlığı yoluyla günlük yemek seçimlerini basitleştirmek şaşırtıcı derecede zihinsel berraklık sağlayabilir." },
{ id: 23, eng: "Recognizing personal limitations and acknowledging that willpower is a finite biological resource is essential.", tr: "Kişisel sınırları tanımak ve iradenin sınırlı bir biyolojik kaynak olduğunu kabul etmek son derece önemlidir." },
{ id: 24, eng: "In an increasingly complex society saturated with options, protecting our attention is becoming a vital skill.", tr: "Seçeneklerle dolu, giderek karmaşıklaşan bir toplumda dikkatimizi korumak hayati bir beceri haline gelmektedir." },
{ id: 25, eng: "Ultimately, learning to manage decision fatigue enables us to make deliberate, rational, and fulfilling long-term choices.", tr: "Nihayetinde, karar yorgunluğunu yönetmeyi öğrenmek bilinçli, mantıklı ve tatmin edici uzun vadeli seçimler yapmamızı sağlar." }
],
questions: [
{ q: "What happens when willpower is depleted?", options: ["People become energetic", "People take shortcuts or avoid choices", "People remember past events clearly"], answer: 1 },
{ q: "Why did Steve Jobs adopt a monotonous wardrobe?", options: ["To save money", "To preserve cognitive bandwidth", "To impress journalists"], answer: 1 },
{ q: "What biological resource does the prefrontal cortex consume during analytical tasks?", options: ["Adrenaline", "Glucose", "Cortisol"], answer: 1 }
]
},
{ id: 27, level: 'B2', length: 'long', title: 'Urban Green Spaces and Mental Well-being',
sentences: [
{ id: 1, eng: "As urban populations expand rapidly, modern city dwellers are increasingly disconnected from the natural environment.", tr: "Kent nüfusu hızla arttıkça, modern şehir sakinlerinin doğal çevreyle olan bağlantısı giderek kopmaktadır." },
{ id: 2, eng: "High-density urban living is frequently associated with heightened stress levels, chronic anxiety, and cardiovascular ailments.", tr: "Yüksek yoğunluklu şehir yaşamı, sıklıkla yüksek stres seviyeleri, kronik kaygı ve kardiyovasküler rahatsızlıklarla ilişkilendirilir." },
{ id: 3, eng: "Consequently, urban planners and public health officials have begun re-evaluating the vital role of green spaces in metropolitan areas.", tr: "Sonuç olarak, şehir plancıları ve halk sağlığı yetkilileri yeşil alanların metropol bölgelerindeki hayati rolünü yeniden değerlendirmeye başladılar." },
{ id: 4, eng: "Parks, botanical gardens, and community forests serve as essential sanctuaries that mitigate the adverse effects of city life.", tr: "Parklar, botanik bahçeleri ve kent ormanları, şehir yaşamının olumsuz etkilerini hafifleten temel sığınaklar olarak hizmet verir." },
{ id: 5, eng: "Exposure to greenery has been shown to lower salivary cortisol levels, which serves as a biological marker of stress.", tr: "Yeşilliğe maruz kalmanın, stresin biyolojik bir göstergesi olan tükürük kortizol seviyelerini düşürdüğü gösterilmiştir." },
{ id: 6, eng: "In Japan, the therapeutic practice known as Shinrin-yoku, or forest bathing, is actively promoted for preventative healthcare.", tr: "Japonya'da, orman banyosu olarak bilinen terapötik uygulama Shinrin-yoku, koruyucu sağlık hizmetleri için aktif olarak teşvik edilmektedir." },
{ id: 7, eng: "Spending as little as twenty minutes in an environment dominated by trees promotes parasympathetic nervous system activity.", tr: "Ağaçların hakim olduğu bir ortamda sadece yirmi dakika geçirmek bile parasempatik sinir sistemi aktivitesini destekler." },
{ id: 8, eng: "Moreover, vegetation plays a monumental role in improving urban air quality by filtering airborne particulate pollutants.", tr: "Ayrıca bitki örtüsü, havada asılı duran partikül kirleticileri filtreleyerek kentsel hava kalitesini iyileştirmede muazzam bir rol oynar." },
{ id: 9, eng: "Mature trees absorb toxic nitrogen dioxide and particulate matter emitted by heavy traffic on busy avenues.", tr: "Olgun ağaçlar, işlek caddelerdeki yoğun trafiğin yaydığı zehirli azot dioksiti ve partikül maddeleri emer." },
{ id: 10, eng: "By creating canopy shade and releasing moisture through transpiration, urban vegetation substantially lowers ambient summer temperatures.", tr: "Kentsel bitki örtüsü, gölge oluşturarak ve terleme yoluyla nem salarak yazın ortam sıcaklıklarını önemli ölçüde düşürür." },
{ id: 11, eng: "This counteracts the urban heat island effect, which often turns concrete corridors into dangerously hot microclimates.", tr: "Bu durum, beton koridorları tehlikeli derecede sıcak mikroklimlara dönüştüren kentsel ısı adası etkisine karşı koyar." },
{ id: 12, eng: "Aside from direct physiological advantages, neighborhood parks cultivate social cohesion among diverse communities.", tr: "Doğrudan fizyolojik avantajların yanı sıra, mahalle parkları farklı topluluklar arasında sosyal uyumu geliştirir." },
{ id: 13, eng: "Public plazas and green corridors provide welcoming communal areas where neighbors interact, exercise, and socialize.", tr: "Halka açık meydanlar ve yeşil koridorlar, komşuların etkileşimde bulunduğu, spor yaptığı ve sosyalleştiği sıcak toplumsal alanlar sağlar." },
{ id: 14, eng: "Children who grow up with regular access to natural play areas develop stronger immune systems and better cognitive focus.", tr: "Doğal oyun alanlarına düzenli erişimle büyüyen çocuklar, daha güçlü bağışıklık sistemleri ve daha iyi bilişsel odaklanma geliştirirler." },
{ id: 15, eng: "Studies indicate that green schoolyards significantly reduce behavioral problems and symptoms of attention deficit disorders.", tr: "Çalışmalar, yeşil okul bahçelerinin davranış problemlerini ve dikkat eksikliği bozukluğu semptomlarını önemli ölçüde azalttığını göstermektedir." },
{ id: 16, eng: "Furthermore, psychological restoration occurs naturally when human senses observe natural patterns, such as leaves rustling in the breeze.", tr: "Dahası, insan duyuları rüzgarda hışırdayan yapraklar gibi doğal desenleri gözlemlediğinde psikolojik yenilenme kendiliğinden gerçekleşir." },
{ id: 17, eng: "According to attention restoration theory, natural settings allow directed attention mechanisms to rest and recharge effortlessly.", tr: "Dikkat yenilenmesi teorisine göre doğal ortamlar, yönlendirilmiş dikkat mekanizmalarının zahmetsizce dinlenmesine ve şarj olmasına olanak tanır." },
{ id: 18, eng: "In response to these compelling findings, progressive municipalities are integrating innovative architecture with living flora.", tr: "Bu çarpıcı bulgulara yanıt olarak ilerici belediyeler, yenilikçi mimariyi canlı bitki örtüsüyle bütünleştirmektedir." },
{ id: 19, eng: "Vertical gardens, vegetated rooftops, and biodiverse corridors are transforming sterile skyscraper facades into vibrant ecosystems.", tr: "Dikey bahçeler, bitkili çatılar ve biyoçeşitli koridorlar, steril gökdelen cephelerini canlı ekosistemlere dönüştürüyor." },
{ id: 20, eng: "Cities like Singapore have embraced the ambitious philosophy of transforming from a garden city into a city within a garden.", tr: "Singapur gibi şehirler, bir bahçe şehirden bahçe içinde bir şehre dönüşme yönündeki iddialı felsefeyi benimsemiştir." },
{ id: 21, eng: "Nevertheless, socioeconomic disparities often determine who benefits from proximity to pristine natural spaces in large cities.", tr: "Bununla birlikte, sosyoekonomik eşitsizlikler genellikle büyük şehirlerde bozulmamış doğal alanlara yakınlıktan kimin yararlanacağını belirler." },
{ id: 22, eng: "Low-income neighborhoods frequently suffer from a noticeable lack of tree canopy cover and public recreational facilities.", tr: "Düşük gelirli mahalleler sıklıkla belirgin bir ağaç gölgesi ve halka açık dinlenme tesisleri eksikliğinden muzdariptir." },
{ id: 23, eng: "Achieving environmental justice requires equitable municipal investment to ensure that every resident enjoys access to greenery.", tr: "Çevresel adaleti sağlamak, her sakinin yeşilliğe erişebilmesini temin etmek için adil belediye yatırımları gerektirir." },
{ id: 24, eng: "Integrating nature into dense urban design is no longer a cosmetic luxury, but an imperative public health necessity.", tr: "Doğayı yoğun kentsel tasarıma entegre etmek artık kozmetik bir lüks değil, zorunlu bir halk sağlığı gerekliliğidir." },
{ id: 25, eng: "As urbanization continues, the preservation of our psychological harmony depends profoundly on preserving urban biodiversity.", tr: "Kentleşme sürdükçe, psikolojik dengemizin korunması büyük ölçüde kentsel biyoçeşitliliğin korunmasına bağlı olacaktır." }
],
questions: [
{ q: "What biological marker decreases when humans are exposed to greenery?", options: ["Salivary cortisol", "Blood sugar", "Insulin levels"], answer: 0 },
{ q: "What is the Japanese therapeutic practice of forest bathing called?", options: ["Origami", "Shinrin-yoku", "Ikebana"], answer: 1 },
{ q: "According to the text, why is urban greenery no longer a cosmetic luxury?", options: ["It attracts tourists", "It is an imperative public health necessity", "It increases real estate prices"], answer: 1 }
]
},
{ id: 28, level: 'B2', length: 'long', title: 'The Evolution of Global Supply Chains',
sentences: [
{ id: 1, eng: "Over the past four decades, advancements in telecommunications and shipping technology catalyzed unprecedented globalization.", tr: "Geçtiğimiz kırk yıl boyunca, telekomünikasyon ve deniz taşımacılığı teknolojisindeki gelişmeler benzeri görülmemiş bir küreselleşmeyi tetikledi." },
{ id: 2, eng: "Multinational corporations dismantled localized production models in pursuit of operational efficiency and lower labor costs abroad.", tr: "Çok uluslu şirketler, operasyonel verimlilik ve yurtdışındaki daha düşük iş gücü maliyetleri arayışıyla yerelleştirilmiş üretim modellerini terk etti." },
{ id: 3, eng: "This transformation gave rise to hyper-specialized global supply chains that span across continents and multiple oceans.", tr: "Bu dönüşüm, kıtaları ve birden fazla okyanusu aşan aşırı uzmanlaşmış küresel tedarik zincirlerinin doğmasına yol açtı." },
{ id: 4, eng: "Under the prevailing philosophy of just-in-time manufacturing, inventory stockpiles were minimized to reduce warehousing expenses.", tr: "Tam zamanında üretim felsefesinin hakimiyeti altında, depolama masraflarını azaltmak için envanter stokları en aza indirildi." },
{ id: 5, eng: "Components for complex consumer goods, such as smartphones and automobiles, were sourced from dozens of distinct nations.", tr: "Akıllı telefonlar ve otomobiller gibi karmaşık tüketim mallarının bileşenleri, düzinelerce farklı ülkeden tedarik edildi." },
{ id: 6, eng: "While this lean operational paradigm lowered consumer prices worldwide, it introduced severe systemic fragility.", tr: "Bu yalın operasyonel paradigma dünya çapında tüketici fiyatlarını düşürürken, ciddi sistemik kırılganlıklar getirdi." },
{ id: 7, eng: "The catastrophic disruptions caused by recent geopolitical crises exposed the vulnerabilities inherent in hyper-connected logistics.", tr: "Son jeopolitik krizlerin neden olduğu yıkıcı aksaklıklar, hiper-bağlantılı lojistiğin doğasında var olan kırılganlıkları açığa çıkardı." },
{ id: 8, eng: "A single bottleneck at a critical maritime chokepoint, such as the Suez Canal, can immobilize billions of dollars in cargo.", tr: "Süveyş Kanalı gibi kritik bir deniz darboğazındaki tek bir tıkanıklık, milyarlarca dolarlık kargoyu hareketsiz kılabilir." },
{ id: 9, eng: "Furthermore, international factory shutdowns revealed how dependent the global economy had become on concentrated semiconductor manufacturing.", tr: "Dahası, uluslararası fabrika kapanışları, küresel ekonominin yoğunlaşmış yarı iletken üretimine ne kadar bağımlı hale geldiğini ortaya çıkardı." },
{ id: 10, eng: "When automotive plants lacked minuscule microchips, entire assembly lines ground to an abrupt and costly standstill.", tr: "Otomotiv fabrikaları küçücük mikroçiplerden yoksun kaldığında, tüm montaj hatları ani ve maliyetli bir durma noktasına geldi." },
{ id: 11, eng: "In response to these alarming vulnerabilities, corporate leaders are fundamentally rethinking international logistics strategies.", tr: "Bu endişe verici kırılganlıklara yanıt olarak kurumsal liderler, uluslararası lojistik stratejilerini kökten yeniden değerlendiriyorlar." },
{ id: 12, eng: "The former emphasis on pure cost minimization is rapidly being superseded by an urgent requirement for supply chain resilience.", tr: "Saf maliyet minimizasyonuna yapılan önceki vurgu, yerini hızla acil bir tedarik zinciri esnekliği ve dayanıklılığı gereksinimine bırakıyor." },
{ id: 13, eng: "Companies are increasingly diversifying their supplier networks rather than relying exclusively on a single geographic region.", tr: "Şirketler yalnızca tek bir coğrafi bölgeye güvenmek yerine tedarikçi ağlarını giderek çeşitlendiriyorlar." },
{ id: 14, eng: "The emerging practice of nearshoring involves relocating manufacturing facilities closer to domestic consumer markets.", tr: "Giderek yaygınlaşan 'nearshoring' (yakın ülkeye taşıma) uygulaması, üretim tesislerinin yerel tüketici pazarlarına daha yakın yerlere taşınmasını içerir." },
{ id: 15, eng: "By moving production to neighboring countries, businesses shorten shipping transit times and circumvent volatile international tariffs.", tr: "Üretimi komşu ülkelere kaydırarak işletmeler, nakliye sürelerini kısaltır ve değişken uluslararası gümrük vergilerinden kaçınırlar." },
{ id: 16, eng: "In parallel, friendshoring encourages partnerships between nations that share compatible political and regulatory values.", tr: "Buna paralel olarak 'friendshoring', uyumlu siyasi ve yasal değerleri paylaşan uluslar arasındaki ortaklıkları teşvik eder." },
{ id: 17, eng: "Advanced technologies are also playing a transformative role in enhancing the visibility of complex distribution networks.", tr: "İleri teknolojiler de karmaşık dağıtım ağlarının görünürlüğünü artırmada dönüştürücü bir rol oynamaktadır." },
{ id: 18, eng: "Real-time satellite tracking, predictive machine learning algorithms, and automated warehouses empower managers to anticipate logistical bottlenecks.", tr: "Gerçek zamanlı uydu takibi, öngörücü makine öğrenimi algoritmaları ve otomatik depolar yöneticilere lojistik darboğazları önceden tahmin etme gücü verir." },
{ id: 19, eng: "Environmental sustainability represents another powerful catalyst driving the reconfiguration of international trade routes.", tr: "Çevresel sürdürülebilirlik, uluslararası ticaret yollarının yeniden yapılandırılmasını sağlayan bir diğer güçlü katalizördür." },
{ id: 20, eng: "Maritime shipping vessels generate substantial greenhouse gas emissions, prompting international maritime authorities to implement stricter standards.", tr: "Deniz taşımacılığı gemileri önemli miktarda sera gazı emisyonu üretmekte, bu da uluslararası denizcilik otoritelerini daha katı standartlar uygulamaya yöneltmektedir." },
{ id: 21, eng: "Consequently, forward-thinking enterprises are investing in greener logistics, alternative fuels, and circular economy practices.", tr: "Sonuç olarak, ileri görüşlü girişimler daha yeşil lojistiğe, alternatif yakıtlara ve döngüsel ekonomi uygulamalarına yatırım yapmaktadır." },
{ id: 22, eng: "Transforming entrenched distribution networks requires substantial financial capital and years of meticulous strategic planning.", tr: "Kökleşmiş dağıtım ağlarını dönüştürmek, önemli miktarda finansal sermaye ve yıllarca sürecek titiz bir stratejik planlama gerektirir." },
{ id: 23, eng: "Smaller enterprises that lack financial leverage often struggle to navigate these profound structural shifts in world trade.", tr: "Finansal güçten yoksun daha küçük işletmeler, dünya ticaretindeki bu derin yapısal değişimleri yönetmekte sıklıkla zorlanırlar." },
{ id: 24, eng: "Nevertheless, agility and transparency have become decisive prerequisites for commercial survival in an volatile global market.", tr: "Yine de çeviklik ve şeffaflık, oynak bir küresel pazarda ticari hayatta kalmanın belirleyici ön koşulları haline gelmiştir." },
{ id: 25, eng: "The future of international trade will belong to organizations that can balance economic efficiency with geopolitical foresight.", tr: "Uluslararası ticaretin geleceği, ekonomik verimlilik ile jeopolitik öngörüyü dengeleyebilen kuruluşlara ait olacaktır." }
],

{ id: 29, level: 'B2', length: 'long', title: 'Ethical Dilemmas in AI and Automation',
sentences: [
{ id: 1, eng: "The rapid emergence of autonomous systems is profoundly reshaping contemporary industries, legal frameworks, and ethical philosophies.", tr: "Otonom sistemlerin hızlı yükselişi çağdaş endüstrileri, yasal çerçeveleri ve ahlaki felsefeleri derinden yeniden şekillendiriyor." },
{ id: 2, eng: "Machine learning algorithms now influence critical societal outcomes, from loan approvals to medical diagnoses and criminal sentencing.", tr: "Makine öğrenimi algoritmaları artık kredi onaylarından tıbbi teşhislere ve ceza infazlarına kadar kritik toplumsal sonuçları etkilemektedir." },
{ id: 3, eng: "While automated decision-making promises unmatched processing speed and analytical precision, it creates intricate moral quandaries.", tr: "Otomatik karar verme benzersiz bir işlem hızı ve analitik hassasiyet vaat etse de karmaşık ahlaki çıkmazlar yaratmaktadır." },
{ id: 4, eng: "One fundamental concern revolves around algorithmic bias, which occurs when models inherit prejudices embedded in historical data.", tr: "Temel endişelerden biri, modellerin geçmiş verilere gömülü önyargıları miras almasıyla ortaya çıkan algoritmik önyargı etrafında dönmektedir." },
{ id: 5, eng: "If training datasets reflect systemic discrimination, predictive algorithms inevitably perpetuate and amplify these historical injustices.", tr: "Eğitim veri setleri sistemsel ayrımcılığı yansıtıyorsa, öngörücü algoritmalar bu tarihsel adaletsizlikleri kaçınılmaz olarak sürdürür ve büyütür." },
{ id: 6, eng: "For instance, facial recognition algorithms have historically demonstrated substantially higher error rates when identifying ethnic minorities.", tr: "Örneğin, yüz tanıma algoritmaları etnik azınlıkları tanımlarken geçmişte çok daha yüksek hata oranları göstermiştir." },
{ id: 7, eng: "Such algorithmic discrepancies in law enforcement tools can result in wrongful arrests and severe infringements on civil liberties.", tr: "Kolluk kuvvetleri araçlarındaki bu tür algoritmik tutarsızlıklar, haksız tutuklamalara ve sivil özgürlüklerin ağır ihlallerine yol açabilir." },
{ id: 8, eng: "Another perplexing challenge is the so-called black box problem, where deep neural networks cannot explain their reasoning.", tr: "Diğer bir kafa karıştırıcı zorluk, derin sinir ağlarının akıl yürütmelerini açıklayamadığı sözde kara kutu problemidir." },
{ id: 9, eng: "When a computer vision system detects a rare pathology, physicians must decide whether to trust an unexplainable conclusion.", tr: "Bir bilgisayarlı görü sistemi nadir bir patoloji tespit ettiğinde, hekimler açıklanamayan bir sonuca güvenip güvenmeyeceklerine karar vermelidir." },
{ id: 10, eng: "In legal proceedings, due process guarantees that individuals have the right to understand why an unfavorable decision was rendered.", tr: "Yasal süreçlerde adil yargılanma hakkı, bireylerin aleyhlerine verilen bir kararın gerekçesini anlama hakkını garanti eder." },
{ id: 11, eng: "If a proprietary algorithm denies an individual parole or bail, that lack of transparency compromises foundational constitutional rights.", tr: "Tescilli bir algoritma bir bireye şartlı tahliye veya kefaleti reddederse, bu şeffaflık eksikliği temel anayasal hakları zedeler." },
{ id: 12, eng: "The deployment of autonomous vehicles presents equally harrowing philosophical conundrums on public highways.", tr: "Otonom araçların yollara çıkması, halka açık otoyollarda aynı derecede sarsıcı felsefi muammalar sunmaktadır." },
{ id: 13, eng: "In unavoidable collision scenarios, how should an onboard software program prioritize human lives across conflicting moral principles?", tr: "Kaçınılmaz çarpışma senaryolarında, yerleşik bir yazılım programı çatışan ahlaki ilkeler karşısında insan hayatlarına nasıl öncelik vermelidir?" },
{ id: 14, eng: "Philosophers frequently invoke the classic trolley problem to debate whether programmers should prioritize passengers or pedestrians.", tr: "Filozoflar, programcıların yolculara mı yoksa yayalara mı öncelik vermesi gerektiğini tartışmak için sıklıkla klasik tramvay problemini anarlar." },
{ id: 15, eng: "Furthermore, widespread workplace automation raises urgent economic questions concerning the future of human labor and dignity.", tr: "Ayrıca, yaygın iş yeri otomasyonu insan emeğinin ve onurunun geleceğine ilişkin acil ekonomik soruları gündeme getirmektedir." },
{ id: 16, eng: "Generative models and autonomous robots are increasingly capable of replacing skilled knowledge workers as well as manual laborers.", tr: "Üretken modeller ve otonom robotlar, kol gücüyle çalışan işçilerin yanı sıra nitelikli bilgi çalışanlarının da yerini alabilme yeteneğini giderek artırıyor." },
{ id: 17, eng: "Although technological revolutions historically generate novel industries, the unprecedented speed of AI adoption threatens widespread displacement.", tr: "Teknolojik devrimler tarihsel olarak yeni endüstriler üretse de, yapay zekanın benimsenmesindeki benzeri görülmemiş hız yaygın işsizlik tehdidi oluşturuyor." },
{ id: 18, eng: "Economists fear that wealth could become unprecedentedly concentrated among a tiny elite of technology monopolists.", tr: "Ekonomistler, servetin benzeri görülmemiş bir şekilde küçük bir teknoloji tekelcisi elit arasında toplanmasından endişe etmektedir." },
{ id: 19, eng: "To mitigate these prospective social crises, thinkers advocate for universal basic income and comprehensive retraining initiatives.", tr: "Bu olası sosyal krizleri hafifletmek için düşünürler, evrensel temel geliri ve kapsamlı yeniden eğitim girişimlerini savunmaktadır." },
{ id: 20, eng: "Governments across the world are gradually recognizing the imperative need for enforceable legislative frameworks and oversight bodies.", tr: "Dünya genelindeki hükümetler, uygulanabilir yasal çerçevelere ve denetim organlarına duyulan zorunlu ihtiyacı giderek daha fazla kabul ediyor." },
{ id: 21, eng: "The European Union has pioneered comprehensive regulatory architecture categorizing artificial intelligence applications by risk level.", tr: "Avrupa Birliği, yapay zeka uygulamalarını risk düzeyine göre sınıflandıran kapsamlı bir düzenleyici mimariye öncülük etmiştir." },
{ id: 22, eng: "High-risk systems must undergo rigorous pre-market compliance testing and guarantee meaningful human oversight at all stages.", tr: "Yüksek riskli sistemler piyasa öncesi sıkı uyumluluk testlerinden geçmeli ve her aşamada anlamlı bir insan denetimini garanti etmelidir." },
{ id: 23, eng: "Technologists, ethicists, and lawmakers must collaborate proactively rather than reacting retroactively to preventable technological catastrophes.", tr: "Teknoloji uzmanları, etikçiler ve yasa koyucular, önlenebilir teknolojik felaketlere sonradan tepki vermek yerine proaktif olarak iş birliği yapmalıdır." },
{ id: 24, eng: "Innovation must ultimately serve human well-being rather than treating human beings as mere data points or economic collateral.", tr: "İnovasyon nihayetinde insanları yalnızca veri noktaları veya ekonomik birer tali hasar olarak görmek yerine insan refahına hizmet etmelidir." },
{ id: 25, eng: "Establishing robust moral guardrails today will determine whether artificial intelligence becomes a blessing or an existential hazard.", tr: "Bugün sağlam ahlaki güvenceler oluşturmak, yapay zekanın bir lütuf mu yoksa varoluşsal bir tehlike mi olacağını belirleyecektir." }
],

{ id: 30, level: 'B2', length: 'long', title: 'The Impact of Bilingualism on Brain Plasticity',
sentences: [
{ id: 1, eng: "For many decades, traditional educational theory erroneously suggested that raising children bilingually would impede cognitive development.", tr: "Uzun yıllar boyunca geleneksel eğitim teorisi, çocukları iki dilli yetiştirmenin bilişsel gelişimi engelleyeceğini hatalı bir şekilde ileri sürmüştür." },
{ id: 2, eng: "Skeptics claimed that managing two linguistic systems simultaneously would confuse young minds and delay grammatical mastery.", tr: "Şüpheciler, iki dil sistemini aynı anda yönetmenin genç zihinlerin kafasını karıştıracağını ve dilbilgisi hakimiyetini geciktireceğini iddia ettiler." },
{ id: 3, eng: "However, extensive modern neuroimaging research has conclusively overturned these outdated linguistic misconceptions.", tr: "Bununla birlikte, modern nörogörüntüleme araştırmaları bu modası geçmiş dilsel yanılgıları kesin bir şekilde ortadan kaldırmıştır." },
{ id: 4, eng: "Today, neuroscientists recognize that mastering multiple languages profoundly enhances cognitive flexibility and neural architecture.", tr: "Bugün sinirbilimciler, birden fazla dilde uzmanlaşmanın bilişsel esnekliği ve sinirsel mimariyi derinden geliştirdiğini kabul etmektedir." },
{ id: 5, eng: "The human brain exhibits remarkable neuroplasticity, which is the capacity to reorganize and form novel synaptic connections.", tr: "İnsan beyni, yeni sinaptik bağlantılar oluşturma ve yeniden organize olma kapasitesi olan dikkate değer bir nöroplastisite sergiler." },
{ id: 6, eng: "When a bilingual individual converses, both linguistic frameworks remain perpetually active and accessible in the background.", tr: "İki dilli bir birey konuştuğunda, her iki dilsel çerçeve de arka planda sürekli olarak aktif ve erişilebilir kalır." },
{ id: 7, eng: "Consequently, the brain must continually suppress irrelevant vocabulary while retrieving appropriate syntactic structures in real time.", tr: "Sonuç olarak beyin, gerçek zamanlı olarak uygun sözdizimsel yapıları çağırırken alakasız kelimeleri sürekli olarak bastırmak zorundadır." },
{ id: 8, eng: "This persistent mental workout strengthens executive functioning, which governs self-regulation, planning, and goal-oriented attention.", tr: "Bu aralıksız zihinsel antrenman; özdenetim, planlama ve hedefe yönelik dikkati yöneten yürütücü işlevleri güçlendirir." },
{ id: 9, eng: "As a direct result, multilingual speakers often demonstrate superior aptitude in multitasking and filtering out environmental distractions.", tr: "Doğrudan bir sonuç olarak, çok dilli konuşmacılar genellikle çoklu görevlerde ve çevresel dikkat dağıtıcıları filtrelemede üstün yetenek sergilerler." },
{ id: 10, eng: "They can transition between contrasting tasks more efficiently because their prefrontal cortex has undergone rigorous daily conditioning.", tr: "Farklı görevler arasında daha verimli bir şekilde geçiş yapabilirler çünkü prefrontal korteksleri sıkı bir günlük koşullanmadan geçmiştir." },
{ id: 11, eng: "In addition, acquiring languages with distinct phonetic inventories substantially improves auditory processing and auditory memory.", tr: "Ek olarak, farklı fonetik envanterlere sahip dilleri edinmek işitsel işlemeyi ve işitsel hafızayı önemli ölçüde geliştirir." },
{ id: 12, eng: "Bilingual children frequently exhibit enhanced metalinguistic awareness, enabling them to comprehend the abstract rules underlying language.", tr: "İki dilli çocuklar sıklıkla gelişmiş bir üst-dilsel farkındalık sergileyerek dilin altında yatan soyut kuralları kavramalarını sağlarlar." },
{ id: 13, eng: "They realize at an earlier age that words are arbitrary symbols representing real-world concepts rather than inherent realities.", tr: "Kelimelerin doğuştan gelen gerçeklikler olmaktan ziyade gerçek dünya kavramlarını temsil eden keyfi semboller olduğunu daha erken yaşta anlarlar." },
{ id: 14, eng: "This heightened conceptual awareness often fosters stronger reading comprehension skills and creative problem-solving capabilities.", tr: "Bu artan kavramsal farkındalık genellikle daha güçlü okuduğunu anlama becerilerini ve yaratıcı problem çözme yeteneklerini besler." },
{ id: 15, eng: "The advantages of multilingualism extend far beyond early developmental milestones and academic achievement in childhood.", tr: "Çok dilliliğin avantajları, çocukluktaki erken gelişimsel kilometre taşlarının ve akademik başarının çok ötesine uzanır." },
{ id: 16, eng: "Crucially, neuroprotective benefits persist throughout adulthood and provide tangible defense against neurodegenerative disorders.", tr: "Daha da önemlisi, nörokoruyucu faydalar yetişkinlik boyunca devam eder ve nörodejeneratif bozukluklara karşı somut bir savunma sağlar." },
{ id: 17, eng: "Longitudinal epidemiological investigations demonstrate that lifelong bilingualism delays the symptomatic onset of dementia and Alzheimer's disease.", tr: "Boylamsal epidemiyolojik araştırmalar, yaşam boyu iki dilliliğin demans ve Alzheimer hastalığının semptomatik başlangıcını geciktirdiğini göstermektedir." },
{ id: 18, eng: "While bilingual brains may still experience physical pathology, they possess substantially greater cognitive reserve to compensate.", tr: "İki dilli beyinler fiziksel patolojiyi yine de yaşayabilirken, bunu telafi etmek için önemli ölçüde daha büyük bir bilişsel rezerve sahiptirler." },
{ id: 19, eng: "Cognitive reserve refers to the brain's ability to improvise alternative neural pathways to navigate structural damage.", tr: "Bilişsel rezerv, beynin yapısal hasarı bertaraf etmek için alternatif sinir yolları doğaçlama yeteneğini ifade eder." },
{ id: 20, eng: "On average, active bilingual patients exhibit clinical symptoms of dementia four to five years later than monolingual counterparts.", tr: "Ortalama olarak, aktif iki dilli hastalar demansın klinik belirtilerini tek dilli emsallerine göre dört ila beş yıl daha geç gösterirler." },
{ id: 21, eng: "Furthermore, recovering linguistic abilities after traumatic brain injuries or strokes is often more favorable among polyglots.", tr: "Dahası, travmatik beyin yaralanmaları veya felçlerden sonra dil yeteneklerini geri kazanmak, çok dilli olanlar arasında genellikle daha olumludur." },
{ id: 22, eng: "Although learning a second language as an adult requires disciplined effort, neuroplastic remodeling occurs regardless of chronological age.", tr: "Bir yetişkin olarak ikinci bir dil öğrenmek disiplinli bir çaba gerektirse de, nöroplastik yeniden yapılanma kronolojik yaştan bağımsız olarak gerçekleşir." },
{ id: 23, eng: "Adults who embark on foreign language acquisition stimulate white matter integrity and foster new neural connectivity.", tr: "Yabancı dil edinimine başlayan yetişkinler beyaz cevher bütünlüğünü uyarır ve yeni sinirsel bağlantıları beslerler." },
{ id: 24, eng: "Language learning serves as an exceptional mental exercise that keeps neural circuits youthful, resilient, and adaptive.", tr: "Dil öğrenimi, sinir devrelerini genç, dayanıklı ve uyumlu tutan olağanüstü bir zihinsel egzersiz işlevi görür." },
{ id: 25, eng: "Ultimately, embracing linguistic diversity not only enriches cultural understanding, but also fortifies the longevity of our minds.", tr: "Nihayetinde, dilsel çeşitliliği kucaklamak yalnızca kültürel anlayışı zenginleştirmekle kalmaz, aynı zamanda zihinlerimizin uzun ömürlülüğünü de pekiştirir." }
],
