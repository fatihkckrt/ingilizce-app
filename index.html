  }, [savedWords]);

  useEffect(() => {
    localStorage.setItem('customTexts', JSON.stringify(customTexts));
  }, [customTexts]);

  useEffect(() => {
    if (toastMessage) {
      const timer = setTimeout(() => setToastMessage(null), 3000);
      return () => clearTimeout(timer);
    }
  }, [toastMessage]);

  const speak = (text) => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  };

  const cleanWord = (word) => {
    if (!word) return '';
    return word.replace(/[.,!?:;"()]/g, '').trim().toLowerCase();
  };

  const getWordLevel = (wordStr, currentTextLevel) => {
    const clean = cleanWord(wordStr);
    if (wordLevelMap[clean]) return wordLevelMap[clean];
    if (currentTextLevel && ['A1', 'A2', 'B1', 'B2', 'C1'].includes(currentTextLevel)) {
      return currentTextLevel;
    }
    return 'B1';
  };

  const handleWordClick = (word, index, sentenceWords, sentenceId) => {
    const cleanWords = sentenceWords.map(w => cleanWord(w));
    const clickedCleanWord = cleanWords[index];

    const detectedLevel = getWordLevel(clickedCleanWord, activeText?.level);
    setSelectedLevelTag(detectedLevel);

    const singleWordData = {
      original: clickedCleanWord,
      translated: dictionary[clickedCleanWord] || "(Anlamı bulunamadı)"
    };

    let foundPhraseData = null;
    let matchedIndices = [index];

    for (let len = 3; len >= 2; len--) {
      for (let start = Math.max(0, index - len + 1); start <= index; start++) {
        if (start + len <= cleanWords.length) {
          const phraseCandidate = cleanWords.slice(start, start + len).join(' ');
          if (dictionary[phraseCandidate]) {
            matchedIndices = Array.from({length: len}, (_, i) => start + i);
            foundPhraseData = {
              original: sentenceWords.slice(start, start + len).join(' '),
              translated: dictionary[phraseCandidate]
            };
            break;
          }
        }
      }
      if (foundPhraseData) break;
    }

    setSelectedTranslation({ word: singleWordData, phrase: foundPhraseData });
    setActiveHighlight({ sentenceId, indices: matchedIndices });
    speak(foundPhraseData ? foundPhraseData.original : singleWordData.original);
  };

  const startReading = (text) => {
    setActiveText(text);
    setCurrentView('reading');
    setRevealedSentences({});
    setShowFullTranslation(false);
    setSelectedTranslation(null);
    setActiveHighlight(null);
  };

  const goBack = () => {
    if (currentView === 'reading' || currentView === 'textQuiz') {
      if (activeText?.isCustom) {
        setCurrentView('customList');
      } else {
        setCurrentView('levels');
      }
      setActiveText(null);
      setQuizScore(null);
      setQuizAnswers({});
      setSelectedTranslation(null);
      setActiveHighlight(null);
    } else if (['levels', 'savedWords', 'vocabTest', 'addText', 'customList'].includes(currentView)) {
      setCurrentView('home');
      setSelectedLevel(null);
      setLengthFilter('all');
    }
  };

  const handleFinishReading = () => {
    if (activeText && activeText.questions && activeText.questions.length > 0) {
      setCurrentView('textQuiz');
      setQuizAnswers({});
      setQuizScore(null);
      setSelectedTranslation(null);
    } else {
      completeTextAndGoBack();
    }
  };

  const completeTextAndGoBack = () => {
    if (activeText && !completedTexts.includes(activeText.id)) {
      setCompletedTexts(prev => [...prev, activeText.id]);
    }
    setToastMessage("Tebrikler! Metin tamamlandı. 🎉");
    setTimeout(() => { goBack(); }, 300);
  };

  const checkTextQuiz = () => {
    if (!activeText || !activeText.questions) return;
    let score = 0;
    activeText.questions.forEach((q, idx) => {
      if (quizAnswers[idx] === q.answer) score++;
    });
    setQuizScore(score);
    if (score === activeText.questions.length && !completedTexts.includes(activeText.id)) {
      setCompletedTexts(prev => [...prev, activeText.id]);
    }
  };

  const toggleSaveWord = (wordObj, chosenLevel) => {
    setSavedWords(prev => {
      const isSaved = prev.some(w => w.original.toLowerCase() === wordObj.original.toLowerCase());
      if (isSaved) {
        setToastMessage(`"${wordObj.original}" defterden kaldırıldı.`);
        return prev.filter(w => w.original.toLowerCase() !== wordObj.original.toLowerCase());
      }
      setToastMessage(`"${wordObj.original}" (${chosenLevel || 'B1'}) kaydedildi! ⭐`);
      return [...prev, { ...wordObj, level: chosenLevel || selectedLevelTag || 'B1' }];
    });
  };

  const isWordSaved = (wordStr) => savedWords.some(w => w.original.toLowerCase() === wordStr.toLowerCase());

  const getSavedWordLevel = (wordStr) => {
    const found = savedWords.find(w => w.original.toLowerCase() === wordStr.toLowerCase());
    return found ? found.level : null;
  };

  const handleSaveCustomText = () => {
    if (!newEngText.trim()) {
      setToastMessage("Lütfen İngilizce metin girin.");
      return;
    }

    const engSentences = newEngText
      .split(/(?<=[.?!])\s+|\n+/)
      .map(s => s.trim())
      .filter(s => s.length > 0);

    const trSentences = newTrText.trim()
      ? newTrText.split(/(?<=[.?!])\s+|\n+/).map(s => s.trim()).filter(s => s.length > 0)
      : [];

    const sentences = engSentences.map((eng, idx) => ({
      id: idx + 1,
      eng: eng,
      tr: trSentences[idx] || "Bu cümle için çeviri girilmedi. (Kelimelere tıklayarak öğrenebilirsin)"
    }));

    const textItem = {
      id: 'custom_' + Date.now(),
      level: newLevel,
      length: sentences.length <= 5 ? 'short' : sentences.length <= 12 ? 'medium' : 'long',
      title: newTitle.trim() || 'Özel Metin #' + (customTexts.length + 1),
      sentences: sentences,
      isCustom: true,
      questions: []
    };

    setCustomTexts(prev => [textItem, ...prev]);
    setNewTitle('');
    setNewEngText('');
    setNewTrText('');
    setToastMessage("Özel metin başarıyla eklendi! 📖");
    startReading(textItem);
  };

  const deleteCustomText = (e, textId) => {
    e.stopPropagation();
    if (confirm("Bu metni silmek istediğinize emin misiniz?")) {
      setCustomTexts(prev => prev.filter(t => t.id !== textId));
      setCompletedTexts(prev => prev.filter(id => id !== textId));
      setToastMessage("Metin silindi.");
    }
  };

  const startVocabTest = () => {
    const listToUse = wordFilterLevel === 'ALL' 
      ? savedWords 
      : savedWords.filter(w => w.level === wordFilterLevel);

    if (listToUse.length < 3) {
      setToastMessage("Test için bu seviyede en az 3 kelime olmalı.");
      return;
    }
    const allTranslations = Array.from(new Set(Object.values(dictionary).filter(v => v)));
    const questions = listToUse.map(word => {
      const correct = word.translated;
      let wrongOptions = [];
      while (wrongOptions.length < 2) {
        const randomTr = allTranslations[Math.floor(Math.random() * allTranslations.length)];
        if (randomTr && randomTr !== correct && !wrongOptions.includes(randomTr)) {
          wrongOptions.push(randomTr);
        }
      }
      const options = [correct, ...wrongOptions].sort(() => Math.random() - 0.5);
      return { word: word.original, options, correctIndex: options.indexOf(correct), level: word.level };
    });
    setVocabQuestions(questions.sort(() => Math.random() - 0.5).slice(0, 10));
    setCurrentVocabIdx(0);
    setVocabScore(0);
    setVocabTestFinished(false);
    setCurrentView('vocabTest');
  };

  const handleVocabAnswer = (selectedIndex) => {
    const isCorrect = vocabQuestions[currentVocabIdx] && (selectedIndex === vocabQuestions[currentVocabIdx].correctIndex);
    if (isCorrect) setVocabScore(prev => prev + 1);
    setTimeout(() => {
      if (currentVocabIdx + 1 < vocabQuestions.length) setCurrentVocabIdx(prev => prev + 1);
      else setVocabTestFinished(true);
    }, 350);
  };

  const allAvailableTexts = [...defaultTexts, ...customTexts];
  const filteredTexts = allAvailableTexts.filter(t => {
    if (t.level !== selectedLevel) return false;
    if (lengthFilter === 'all') return true;
    return t.length === lengthFilter;
  });

  const filteredSavedWords = wordFilterLevel === 'ALL' 
    ? savedWords 
    : savedWords.filter(w => w.level === wordFilterLevel);

  const getBadgeStyle = (lvl) => {
    switch(lvl) {
      case 'A1': return 'bg-emerald-100 text-emerald-800 border-emerald-300';
      case 'A2': return 'bg-blue-100 text-blue-800 border-blue-300';
      case 'B1': return 'bg-indigo-100 text-indigo-800 border-indigo-300';
      case 'B2': return 'bg-purple-100 text-purple-800 border-purple-300';
      default: return 'bg-amber-100 text-amber-800 border-amber-300';
    }
  };

  return (
    <div className="min-h-screen bg-slate-100 text-slate-800 flex justify-center w-full">
      <div className="w-full max-w-md bg-white shadow-xl min-h-screen relative flex flex-col">

        {/* Header */}
        <div className="bg-indigo-600 text-white p-4 flex items-center shadow-md shrink-0 sticky top-0 z-40">
          {currentView !== 'home' && (
            <button onClick={goBack} className="p-2 mr-1 hover:bg-indigo-500 rounded-full transition text-lg">⬅️</button>
          )}
          <h1 className="text-lg font-bold flex-1 text-center truncate">
            {currentView === 'home' && "İngilizce Öğren"}
            {currentView === 'levels' && `${selectedLevel} Seviye Metinleri`}
            {currentView === 'reading' && (activeText ? activeText.title : 'Okuma')}
            {currentView === 'textQuiz' && "Okuma Sınavı"}
            {currentView === 'savedWords' && "Kelime Defterim"}
            {currentView === 'vocabTest' && "Kelime Testi"}
            {currentView === 'addText' && "Kendi Metnini Ekle"}
            {currentView === 'customList' && "Özel Metinlerim"}
          </h1>
          {currentView !== 'home' && <div className="w-9"></div>}
        </div>

        {/* Toast Bildirimi */}
        {toastMessage && (
          <div className="fixed top-16 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl z-50 flex items-center gap-2 border border-slate-700 animate-bounce">
            <span className="text-lg">⚡</span>
            <p className="text-sm font-medium">{toastMessage}</p>
          </div>
        )}

        {/* HOME VIEW */}
        {currentView === 'home' && (
          <div className="flex-1 p-5 flex flex-col space-y-4 overflow-y-auto">
            <div className="text-center my-3">
              <div className="bg-indigo-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner">
                <span className="text-4xl">🌍</span>
              </div>
              <h2 className="text-2xl font-black text-slate-800">Seviyeni Seç</h2>
              <p className="text-xs text-slate-500 mt-1">Okuyarak ve tıklayarak İngilizce geliştir</p>
            </div>

            {/* Seviye Butonları */}
            <div className="space-y-2.5">
              {levels.map(level => {
                const count = allAvailableTexts.filter(t => t.level === level).length;
                return (
                  <button key={level} onClick={() => { setSelectedLevel(level); setCurrentView('levels'); }}
                    className="w-full bg-white border-2 border-slate-100 p-4 rounded-2xl flex items-center justify-between hover:border-indigo-400 hover:bg-indigo-50/50 shadow-sm transition active:scale-[0.99]">
                    <div className="flex items-center gap-3">
                      <span className={`w-9 h-9 rounded-xl font-bold flex items-center justify-center text-sm border ${getBadgeStyle(level)}`}>
                        {level}
                      </span>
                      <div className="text-left">
                        <span className="font-bold text-base text-slate-800 block">{level} Seviyesi</span>
                        <span className="text-xs text-slate-400 font-medium">{count} Metin Mevcut</span>
                      </div>
                    </div>
                    <span className="text-lg text-slate-300">➔</span>
                  </button>
                );
              })}
            </div>

            {/* Kendi Metnini Ekle */}
            <div className="pt-2">
              <button onClick={() => setCurrentView('addText')}
                className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-4 rounded-2xl flex items-center justify-between shadow-md hover:from-indigo-600 hover:to-purple-700 transition active:scale-[0.98]">
                <div className="flex items-center gap-3">
                  <span className="text-2xl bg-white/20 p-2 rounded-xl">✏️</span>
                  <div className="text-left">
                    <span className="font-bold text-base block">Kendi Metnini Ekle</span>
                    <span className="text-xs text-indigo-100">İnternetten makale veya haber yapıştır</span>
                  </div>
                </div>
                <span className="text-xl">➕</span>
              </button>
            </div>

            {/* Özel Metinlerim */}
            {customTexts.length > 0 && (
              <button onClick={() => setCurrentView('customList')}
                className="w-full bg-purple-50 border-2 border-purple-200 p-4 rounded-2xl flex items-center justify-between hover:border-purple-400 text-purple-900 shadow-sm transition">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">📑</span>
                  <div className="text-left">
                    <span className="font-bold text-base block">Eklediğim Metinler</span>
                    <span className="text-xs text-purple-600">{customTexts.length} özel metin</span>
                  </div>
                </div>
                <span className="bg-purple-600 text-white text-xs font-bold px-2.5 py-1 rounded-full">{customTexts.length}</span>
              </button>
            )}

            {/* Kelime Defterim */}
            <button onClick={() => setCurrentView('savedWords')}
              className="w-full bg-orange-50 border-2 border-orange-200 p-4 rounded-2xl flex items-center justify-between hover:border-orange-500 shadow-sm text-orange-900 transition">
              <div className="flex items-center gap-3">
                <span className="text-2xl">📚</span>
                <div className="text-left">
                  <span className="font-bold text-base block">Kelime Defterim</span>
                  <span className="text-xs text-orange-600">Seviyeli kayıtlar ve test</span>
                </div>
              </div>
              <div className="bg-orange-600 text-white text-xs font-bold px-2.5 py-1 rounded-full">{savedWords.length}</div>
            </button>
          </div>
        )}

        {/* LEVELS VIEW */}
        {currentView === 'levels' && (
          <div className="flex-1 p-4 space-y-3 overflow-y-auto pb-6">
            {filteredTexts.length === 0 ? (
              <div className="text-center text-slate-400 mt-12">Bu seviyede henüz metin yok.</div>
            ) : (
              filteredTexts.map(text => {
                const isCompleted = completedTexts.includes(text.id);
                const lengthColor = text.length === 'short' ? "bg-blue-100 text-blue-700" : text.length === 'medium' ? "bg-amber-100 text-amber-700" : "bg-purple-100 text-purple-700";
                const lengthLabel = text.length === 'short' ? "Kısa" : text.length === 'medium' ? "Orta" : "Uzun";
                return (
                  <button key={text.id} onClick={() => startReading(text)}
                    className={`w-full text-left bg-white p-4 rounded-2xl shadow-sm border flex gap-3.5 items-center hover:shadow-md active:scale-[0.98] transition ${isCompleted ? 'border-green-300 bg-green-50/50' : 'border-slate-200'}`}>
                    <div className={`${isCompleted ? 'bg-green-100 text-green-600' : 'bg-indigo-100 text-indigo-600'} p-3 rounded-xl shrink-0 flex items-center justify-center w-11 h-11`}>
                      <span className="text-xl">{isCompleted ? '✅' : '📄'}</span>
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-1">
                        <h3 className={`font-bold text-base leading-tight ${isCompleted ? 'text-green-900' : 'text-slate-800'}`}>{text.title}</h3>
                        {text.isCustom && <span className="bg-purple-100 text-purple-800 text-[10px] font-bold px-1.5 py-0.5 rounded">ÖZEL</span>}
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${lengthColor}`}>{lengthLabel}</span>
                        <span className="text-xs text-slate-400 font-medium">{text.sentences.length} Cümle</span>
                      </div>
                    </div>
                  </button>
                );
              })
            )}
          </div>
        )}

        {/* CUSTOM LIST VIEW */}
        {currentView === 'customList' && (
          <div className="flex-1 p-4 space-y-3 overflow-y-auto pb-6">
            <div className="flex justify-between items-center mb-2">
              <span className="text-xs font-bold text-slate-500">Kendi Eklediğin Metinler</span>
              <button onClick={() => setCurrentView('addText')} className="text-xs bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg">➕ Yeni Ekle</button>
            </div>
            {customTexts.map(text => {
              const isCompleted = completedTexts.includes(text.id);
              return (
                <div key={text.id} onClick={() => startReading(text)}
                  className="w-full text-left bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center hover:border-indigo-300 cursor-pointer">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded border ${getBadgeStyle(text.level)}`}>{text.level}</span>
                      <h4 className="font-bold text-slate-800">{text.title}</h4>
                      {isCompleted && <span className="text-green-600 text-xs">✓</span>}
                    </div>
                    <p className="text-xs text-slate-400">{text.sentences.length} Cümle</p>
                  </div>
                  <button onClick={(e) => deleteCustomText(e, text.id)} className="p-2 text-slate-300 hover:text-red-500 text-base">🗑️</button>
                </div>
              );
            })}
          </div>
        )}

        {/* ADD CUSTOM TEXT VIEW */}
        {currentView === 'addText' && (
          <div className="flex-1 p-5 space-y-4 overflow-y-auto pb-10 bg-slate-50">
            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Metin Başlığı</label>
                <input
                  type="text"
                  placeholder="Örn: The Power of Habits"
                  value={newTitle}
                  onChange={(e) => setNewTitle(e.target.value)}
                  className="w-full p-3 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Hedef Seviye</label>
                <div className="grid grid-cols-4 gap-2">
                  {['A1', 'A2', 'B1', 'B2'].map(lvl => (
                    <button
                      key={lvl}
                      type="button"
                      onClick={() => setNewLevel(lvl)}
                      className={`py-2 text-xs font-bold rounded-lg border transition ${newLevel === lvl ? 'bg-indigo-600 text-white border-indigo-600 shadow' : 'bg-slate-50 text-slate-700 border-slate-200'}`}
                    >
                      {lvl}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">İngilizce Metin (Zorunlu)</label>
                <textarea
                  rows="6"
                  placeholder="İngilizce metninizi buraya yapıştırın. Noktalardan otomatik cümlelere bölünecektir..."
                  value={newEngText}
                  onChange={(e) => setNewEngText(e.target.value)}
                  className="w-full p-3 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 leading-relaxed"
                ></textarea>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Türkçe Çevirisi (İsteğe Bağlı)</label>
                <textarea
                  rows="3"
                  placeholder="Varsa Türkçe çeviriyi yapıştırın..."
                  value={newTrText}
                  onChange={(e) => setNewTrText(e.target.value)}
                  className="w-full p-3 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 leading-relaxed"
                ></textarea>
              </div>

              <button
                onClick={handleSaveCustomText}
                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-[0.98] flex items-center justify-center gap-2"
              >
                <span>📖</span> Metni Kaydet ve Okumaya Başla
              </button>
            </div>
          </div>
        )}

        {/* READING VIEW */}
        {currentView === 'reading' && activeText && (
          <div className="flex-1 flex flex-col relative">
            <div className="p-5 flex-1 overflow-y-auto space-y-6 pb-36">
              {activeText.sentences.map((sentence) => {
                const sentenceWords = sentence.eng.split(' ');
                const isHighlighted = activeHighlight && activeHighlight.sentenceId === sentence.id;
                return (
                  <div key={sentence.id} className="relative bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
                    <div className="text-base leading-relaxed text-slate-800 flex flex-wrap items-center gap-y-2">
                      <div className="flex-1">
                        {sentenceWords.map((word, idx) => {
                          const isWordHighlighted = isHighlighted && activeHighlight.indices.includes(idx);
                          return (
                            <span key={idx}>
                              <button
                                onClick={() => handleWordClick(word, idx, sentenceWords, sentence.id)}
                                className={`rounded px-1 py-0.5 hover:bg-indigo-100 transition font-medium ${isWordHighlighted ? 'word-highlight font-bold text-indigo-900' : ''}`}
                              >
                                {word}
                              </button>{' '}
                            </span>
                          );
                        })}
                      </div>
                      <div className="flex items-center gap-1 ml-2">
                        <button
                          onClick={() => speak(sentence.eng)}
                          title="Cümleyi Dinle"
                          className="w-7 h-7 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs hover:bg-indigo-100"
                        >🔊</button>
                        <button
                          onClick={() => setRevealedSentences(prev => ({ ...prev, [sentence.id]: !prev[sentence.id] }))}
                          title="Çeviriyi Gör"
                          className="w-7 h-7 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-xs hover:bg-slate-200"
                        >🌐</button>
                      </div>
                    </div>
                    {(revealedSentences[sentence.id] || showFullTranslation) && (
                      <div className="mt-2.5 p-2.5 bg-indigo-50/70 border-l-4 border-indigo-500 text-xs rounded-r-lg text-slate-700 leading-relaxed font-medium">
                        {sentence.tr}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Alt İşlem Çubuğu */}
            <div className="absolute bottom-0 left-0 right-0 p-3.5 bg-white/95 backdrop-blur border-t border-slate-200 shadow-lg flex gap-2.5 z-30">
              <button
                onClick={() => setShowFullTranslation(!showFullTranslation)}
                className={`flex-1 py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition ${showFullTranslation ? 'bg-slate-200 text-slate-700' : 'bg-indigo-100 text-indigo-800'}`}
              >
                <span>🌐</span> {showFullTranslation ? "Gizle" : "Tam Çeviri"}
              </button>
              <button onClick={handleFinishReading} className="flex-[1.4] py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 bg-green-600 text-white shadow hover:bg-green-700 transition">
                <span>✅</span> {activeText.questions?.length > 0 ? "Sınava Geç" : "Metni Bitir"}
              </button>
            </div>
          </div>
        )}

        {/* READING QUIZ VIEW */}
        {currentView === 'textQuiz' && activeText && activeText.questions && (
          <div className="flex-1 p-5 bg-slate-50 overflow-y-auto pb-10">
            <div className="text-center mb-5">
              <h2 className="text-lg font-bold text-slate-800">Okuduğunu Anlama Sınavı</h2>
              <p className="text-xs text-slate-400">Metne göre soruları cevaplayın</p>
            </div>
            <div className="space-y-5">
              {activeText.questions.map((q, qIdx) => (
                <div key={qIdx} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                  <p className="font-bold text-sm text-slate-800 mb-3">{qIdx + 1}. {q.q}</p>
                  <div className="space-y-2">
                    {q.options.map((opt, oIdx) => {
                      const isSelected = quizAnswers[qIdx] === oIdx;
                      const showResult = quizScore !== null;
                      const isCorrect = q.answer === oIdx;
                      let btnClass = "w-full text-left p-3 rounded-xl border text-sm font-medium transition ";
                      if (!showResult) {
                        btnClass += isSelected ? "border-indigo-600 bg-indigo-50 text-indigo-800 font-bold" : "border-slate-200 text-slate-600";
                      } else {
                        if (isCorrect) btnClass += "border-green-500 bg-green-50 text-green-800 font-bold";
                        else if (isSelected && !isCorrect) btnClass += "border-red-500 bg-red-50 text-red-800";
                        else btnClass += "border-slate-200 opacity-40";
                      }
                      return (
                        <button key={oIdx} disabled={showResult}
                          onClick={() => setQuizAnswers(prev => ({...prev, [qIdx]: oIdx}))}
                          className={btnClass}>{opt}</button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
            {quizScore === null ? (
              <button onClick={checkTextQuiz}
                disabled={Object.keys(quizAnswers).length < activeText.questions.length}
                className={`w-full mt-6 py-3.5 rounded-xl font-bold text-sm text-white transition ${Object.keys(quizAnswers).length < activeText.questions.length ? 'bg-slate-300 cursor-not-allowed' : 'bg-indigo-600 shadow-md'}`}>
                Cevapları Kontrol Et
              </button>
            ) : (
              <div className="mt-6 bg-white p-5 rounded-2xl shadow border-t-4 border-indigo-600 text-center">
                <h3 className="text-xl font-black text-slate-800 mb-1">Skorun: {quizScore} / {activeText.questions.length}</h3>
                <p className="text-xs text-slate-500 mb-4">{quizScore === activeText.questions.length ? "Mükemmel! Hepsini doğru cevapladın." : "Biraz daha tekrar yapabilirsin."}</p>
                <button onClick={completeTextAndGoBack} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-sm">
                  Menüye Dön
                </button>
              </div>
            )}
          </div>
        )}

        {/* SAVED WORDS VIEW */}
        {currentView === 'savedWords' && (
          <div className="flex-1 flex flex-col bg-slate-50">
            <div className="p-4 bg-white border-b border-slate-200 shrink-0">
              <div className="flex justify-between items-center mb-3">
                <div>
                  <h3 className="font-bold text-slate-800">Kaydedilen Kelimeler</h3>
                  <p className="text-xs text-slate-400">{filteredSavedWords.length} kelime listeleniyor</p>
                </div>
                <button onClick={startVocabTest} disabled={filteredSavedWords.length < 3}
                  className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl font-bold text-xs ${filteredSavedWords.length < 3 ? 'bg-slate-200 text-slate-400' : 'bg-indigo-600 text-white shadow'}`}>
                  <span>▶️</span> Test Et
                </button>
              </div>

              {/* Seviye Filtre Butonları */}
              <div className="flex gap-1.5 overflow-x-auto scrollbar-hide py-1">
                {['ALL', 'A1', 'A2', 'B1', 'B2'].map(lvl => {
                  const count = lvl === 'ALL' ? savedWords.length : savedWords.filter(w => w.level === lvl).length;
                  return (
                    <button
                      key={lvl}
                      onClick={() => setWordFilterLevel(lvl)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 transition flex items-center gap-1 ${wordFilterLevel === lvl ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                    >
                      <span>{lvl === 'ALL' ? 'Tümü' : lvl}</span>
                      <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${wordFilterLevel === lvl ? 'bg-indigo-700 text-white' : 'bg-slate-200 text-slate-600'}`}>{count}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Kelime Listesi */}
            <div className="flex-1 p-4 space-y-2.5 overflow-y-auto">
              {filteredSavedWords.length === 0 ? (
                <div className="text-center text-slate-400 mt-16">
                  <p className="text-4xl mb-2">🏷️</p>
                  <p className="text-sm font-medium">Bu seviyede kayıtlı kelime bulunamadı.</p>
                  <p className="text-xs text-slate-400 mt-1">Metin okurken kelimelerin üzerine tıklayarak etiketleyebilirsin.</p>
                </div>
              ) : (
                filteredSavedWords.map((wordObj, idx) => (
                  <div key={idx} className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div className="flex items-center gap-3">
                      <span className={`text-[11px] font-black px-2 py-1 rounded-md border ${getBadgeStyle(wordObj.level)}`}>
                        {wordObj.level || 'B1'}
                      </span>
                      <div>
                        <div className="flex items-center gap-2">
                          <h4 className="font-bold text-base text-slate-800">{wordObj.original}</h4>
                          <button onClick={() => speak(wordObj.original)} className="text-xs text-indigo-500">🔊</button>
                        </div>
                        <p className="text-xs text-slate-500 font-medium">{wordObj.translated}</p>
                      </div>
                    </div>
                    <button onClick={() => toggleSaveWord(wordObj, wordObj.level)} className="p-2 text-slate-300 hover:text-red-500 text-sm">✕</button>
                  </div>
                ))
              )}
            </div>
          </div>
        )}

        {/* VOCAB TEST VIEW */}
        {currentView === 'vocabTest' && vocabQuestions.length > 0 && (
          <div className="flex-1 flex flex-col p-6 bg-slate-50">
            {!vocabTestFinished ? (
              <div className="flex-1 flex flex-col">
                <div className="flex justify-between items-center text-xs font-bold text-slate-400 mb-6">
                  <span>Soru {currentVocabIdx + 1} / {vocabQuestions.length}</span>
                  <span className={`px-2 py-0.5 rounded border text-[10px] ${getBadgeStyle(vocabQuestions[currentVocabIdx]?.level)}`}>
                    {vocabQuestions[currentVocabIdx]?.level || 'B1'}
                  </span>
                </div>
                <div className="flex-1 flex flex-col items-center justify-center mb-6">
                  <span className="text-xs text-indigo-500 font-bold uppercase tracking-wider mb-2">Bu kelimenin anlamı nedir?</span>
                  <h2 className="text-3xl font-black text-slate-800 text-center flex items-center gap-2">
                    {vocabQuestions[currentVocabIdx]?.word || ''}
                    <button onClick={() => speak(vocabQuestions[currentVocabIdx]?.word)} className="text-lg text-indigo-500">🔊</button>
                  </h2>
                </div>
                <div className="space-y-2.5 mb-8">
                  {(vocabQuestions[currentVocabIdx]?.options || []).map((opt, idx) => (
                    <button key={idx} onClick={() => handleVocabAnswer(idx)}
                      className="w-full bg-white p-3.5 rounded-2xl border-2 border-indigo-100 text-base font-semibold text-slate-700 text-center hover:border-indigo-400 active:scale-[0.98] transition shadow-sm">
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="flex-1 flex flex-col items-center justify-center text-center space-y-5">
                <div className="bg-green-100 w-20 h-20 rounded-full flex items-center justify-center">
                  <span className="text-4xl">🎉</span>
                </div>
                <div>
                  <h2 className="text-2xl font-bold text-slate-800 mb-1">Test Tamamlandı!</h2>
                  <p className="text-sm text-slate-600">Puanın: <strong className="text-indigo-600 font-black text-lg">{vocabScore} / {vocabQuestions.length}</strong></p>
                </div>
                <button onClick={() => setCurrentView('savedWords')} className="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold text-sm shadow-md">
                  Deftere Dön
                </button>
              </div>
            )}
          </div>
        )}

        {/* ÇEVİRİ VE SEVİYE ETİKETLEME MODALI */}
        {selectedTranslation && (
          <div className="fixed bottom-3 left-3 right-3 max-w-md mx-auto bg-slate-900/95 backdrop-blur text-white p-4 rounded-3xl shadow-2xl z-50 border border-slate-700">
            <button
              onClick={() => { setSelectedTranslation(null); setActiveHighlight(null); }}
              className="absolute top-3 right-3 p-1 text-slate-400 hover:text-white text-base"
            >✕</button>

            {/* Seviye Etiketi Seçici Rozeti */}
            <div className="mb-3 flex items-center gap-2">
              <span className="text-[10px] font-bold uppercase text-slate-400">Seviye Etiketi:</span>
              <div className="flex gap-1">
                {['A1', 'A2', 'B1', 'B2'].map(lvl => (
                  <button
                    key={lvl}
                    onClick={() => setSelectedLevelTag(lvl)}
                    className={`text-[10px] font-black px-2 py-0.5 rounded border transition ${selectedLevelTag === lvl ? 'bg-indigo-600 text-white border-indigo-400' : 'bg-slate-800 text-slate-400 border-slate-700'}`}
                  >
                    {lvl}
                  </button>
                ))}
              </div>
            </div>

            {/* Kelime Grubu (Phrase) varsa */}
            {selectedTranslation.phrase && (
              <div className="mb-3 pb-3 border-b border-slate-800 pr-6">
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] text-indigo-400 font-bold uppercase">Kelime Grubu</span>
                  <button onClick={() => speak(selectedTranslation.phrase.original)} className="text-xs">🔊</button>
                </div>
                <div className="text-lg font-bold text-white leading-snug">{selectedTranslation.phrase.original}</div>
                <div className="text-sm text-indigo-200 mb-2 font-medium">{selectedTranslation.phrase.translated}</div>
                <button
                  onClick={() => toggleSaveWord(selectedTranslation.phrase, selectedLevelTag)}
                  className={`text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition ${isWordSaved(selectedTranslation.phrase.original) ? 'bg-indigo-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}
                >
                  {isWordSaved(selectedTranslation.phrase.original) ? `⭐ [${getSavedWordLevel(selectedTranslation.phrase.original) || selectedLevelTag}] Kaydedildi` : `🔖 ${selectedLevelTag} Olarak Kaydet`}
                </button>
              </div>
            )}

            {/* Tek Kelime */}
            <div className="pr-6">
              <div className="flex items-center gap-2 mb-0.5">
                <span className="text-[10px] text-slate-400 font-bold uppercase">
                  {selectedTranslation.phrase ? "Tıkladığınız Kelime" : "Kelime Çevirisi"}
                </span>
                <button onClick={() => speak(selectedTranslation.word.original)} className="text-xs">🔊</button>
              </div>
              <div className="text-base font-bold text-slate-100">{selectedTranslation.word.original}</div>
              <div className="text-xs text-slate-400 mb-2 font-medium">{selectedTranslation.word.translated}</div>
              <button
                onClick={() => toggleSaveWord(selectedTranslation.word, selectedLevelTag)}
                className={`text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition ${isWordSaved(selectedTranslation.word.original) ? 'bg-indigo-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}
              >
                {isWordSaved(selectedTranslation.word.original) ? `⭐ [${getSavedWordLevel(selectedTranslation.word.original) || selectedLevelTag}] Kaydedildi` : `🔖 ${selectedLevelTag} Olarak Kaydet`}
              </button>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
</script>
</body>
</html>
