                        <h3 className={`font-bold text-base leading-tight ${isCompleted ? 'text-green-950' : 'text-slate-800'}`}>{text.title}</h3>
                        {text.isCustom && <span className="bg-purple-100 text-purple-800 text-[10px] font-bold px-1.5 py-0.5 rounded">ÖZEL</span>}
                      </div>
                      <span className="text-xs text-slate-500 font-semibold">{text.sentences.length} Cümle</span>
                    </div>
                  </button>
                );
              })
            )}
          </div>
        )}

        {/* CUSTOM LIST VIEW */}
        {currentView === 'customList' && (
          <div className="flex-1 p-4 space-y-3 overflow-y-auto pb-6">
            <div className="flex justify-between items-center mb-2">
              <span className="text-xs font-bold text-slate-600">Kendi Eklediğin Metinler</span>
              <button onClick={() => setCurrentView('addText')} className="text-xs bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-3 py-1.5 rounded-lg shadow">➕ Yeni Ekle</button>
            </div>
            {customTexts.map(text => {
              const isCompleted = completedTexts.includes(text.id);
              return (
                <div key={text.id} onClick={() => startReading(text)}
                  className="w-full text-left card-glass p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center hover:border-indigo-400 cursor-pointer transition">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded border ${getBadgeStyle(text.level)}`}>{text.level}</span>
                      <h4 className="font-bold text-slate-800">{text.title}</h4>
                      {isCompleted && <span className="text-green-600 text-xs">✓</span>}
                    </div>
                    <p className="text-xs text-slate-500 font-medium">{text.sentences.length} Cümle</p>
                  </div>
                  <button onClick={(e) => deleteCustomText(e, text.id)} className="p-2 text-slate-400 hover:text-red-500 text-base">🗑️</button>
                </div>
              );
            })}
          </div>
        )}

        {/* ADD CUSTOM TEXT VIEW */}
        {currentView === 'addText' && (
          <div className="flex-1 p-5 space-y-4 overflow-y-auto pb-10">
            <div className="card-glass p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Metin Başlığı</label>
                <input
                  type="text"
                  placeholder="Örn: A Calm Journey"
                  value={newTitle}
                  onChange={(e) => setNewTitle(e.target.value)}
                  className="w-full p-3 text-sm rounded-xl border border-slate-300 bg-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Hedef Seviye</label>
                <div className="grid grid-cols-4 gap-2">
                  {['A1', 'A2', 'B1', 'B2'].map(lvl => (
                    <button
                      key={lvl}
                      type="button"
                      onClick={() => setNewLevel(lvl)}
                      className={`py-2 text-xs font-bold rounded-lg border transition ${newLevel === lvl ? 'bg-indigo-700 text-white border-indigo-700 shadow' : 'bg-white text-slate-700 border-slate-200'}`}
                    >
                      {lvl}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">İngilizce Metin (Zorunlu)</label>
                <textarea
                  rows="6"
                  placeholder="İngilizce metninizi buraya yapıştırın..."
                  value={newEngText}
                  onChange={(e) => setNewEngText(e.target.value)}
                  className="w-full p-3 text-sm rounded-xl border border-slate-300 bg-white focus:outline-none focus:border-indigo-500 leading-relaxed"
                ></textarea>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Türkçe Çevirisi (İsteğe Bağlı)</label>
                <textarea
                  rows="3"
                  placeholder="Varsa Türkçe çeviriyi yapıştırın..."
                  value={newTrText}
                  onChange={(e) => setNewTrText(e.target.value)}
                  className="w-full p-3 text-sm rounded-xl border border-slate-300 bg-white focus:outline-none focus:border-indigo-500 leading-relaxed"
                ></textarea>
              </div>

              <button
                onClick={handleSaveCustomText}
                className="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-[0.98] flex items-center justify-center gap-2"
              >
                <span>📖</span> Metni Kaydet ve Oku
              </button>
            </div>
          </div>
        )}

        {/* READING VIEW */}
        {currentView === 'reading' && activeText && (
          <div className="flex-1 flex flex-col relative">
            <div className="p-5 flex-1 overflow-y-auto space-y-4 pb-36">
              {activeText.sentences.map((sentence) => {
                const sentenceWords = sentence.eng.split(' ');
                const isHighlighted = activeHighlight && activeHighlight.sentenceId === sentence.id;
                return (
                  <div key={sentence.id} className="relative card-glass p-3.5 rounded-2xl border border-slate-200 shadow-sm hover:shadow transition">
                    <div className="text-base leading-relaxed text-slate-800 flex flex-wrap items-center gap-y-2">
                      <div className="flex-1">
                        {sentenceWords.map((word, idx) => {
                          const isWordHighlighted = isHighlighted && activeHighlight.indices.includes(idx);
                          return (
                            <span key={idx}>
                              <button
                                onClick={() => handleWordClick(word, idx, sentenceWords, sentence.id)}
                                className={`rounded px-1 py-0.5 hover:bg-indigo-100 transition font-medium ${isWordHighlighted ? 'word-highlight font-bold text-indigo-950' : ''}`}
                              >
                                {word}
                              </button>{' '}
                            </span>
                          );
                        })}
                      </div>
                      <div className="flex items-center gap-1 ml-2">
                        <button
                          onClick={() => speak(sentence.eng)}
                          title="Cümleyi Dinle"
                          className="w-7 h-7 rounded-full bg-indigo-50 text-indigo-700 flex items-center justify-center text-xs hover:bg-indigo-100 shadow-sm"
                        >🔊</button>
                        <button
                          onClick={() => setRevealedSentences(prev => ({ ...prev, [sentence.id]: !prev[sentence.id] }))}
                          title="Çeviriyi Gör"
                          className="w-7 h-7 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-xs hover:bg-slate-200 shadow-sm"
                        >🌐</button>
                      </div>
                    </div>
                    {(revealedSentences[sentence.id] || showFullTranslation) && (
                      <div className="mt-2.5 p-2.5 bg-indigo-50 border-l-4 border-indigo-600 text-xs rounded-r-lg text-slate-700 leading-relaxed font-medium shadow-inner">
                        {sentence.tr}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Alt İşlem Çubuğu */}
            <div className="absolute bottom-0 left-0 right-0 p-3.5 bg-white/95 border-t border-slate-200 shadow-2xl flex gap-2.5 z-30">
              <button
                onClick={() => setShowFullTranslation(!showFullTranslation)}
                className={`flex-1 py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition ${showFullTranslation ? 'bg-slate-200 text-slate-700' : 'bg-indigo-100 text-indigo-900'}`}
              >
                <span>🌐</span> {showFullTranslation ? "Gizle" : "Tam Çeviri"}
              </button>
              <button onClick={handleFinishReading} className="flex-[1.4] py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 bg-green-600 text-white shadow-md hover:bg-green-700 transition">
                <span>✅</span> {activeText.questions?.length > 0 ? "Sınava Geç" : "Metni Bitir"}
              </button>
            </div>
          </div>
        )}

        {/* READING QUIZ VIEW */}
        {currentView === 'textQuiz' && activeText && activeText.questions && (
          <div className="flex-1 p-5 overflow-y-auto pb-10">
            <div className="text-center mb-5">
              <h2 className="text-lg font-bold text-slate-800">Okuduğunu Anlama Sınavı</h2>
              <p className="text-xs text-slate-500 font-medium">Metne göre soruları cevaplayın</p>
            </div>
            <div className="space-y-4">
              {activeText.questions.map((q, qIdx) => (
                <div key={qIdx} className="card-glass p-4 rounded-2xl shadow-sm border border-slate-200">
                  <p className="font-bold text-sm text-slate-800 mb-3">{qIdx + 1}. {q.q}</p>
                  <div className="space-y-2">
                    {q.options.map((opt, oIdx) => {
                      const isSelected = quizAnswers[qIdx] === oIdx;
                      const showResult = quizScore !== null;
                      const isCorrect = q.answer === oIdx;
                      let btnClass = "w-full text-left p-3 rounded-xl border text-sm font-medium transition ";
                      if (!showResult) {
                        btnClass += isSelected ? "border-indigo-600 bg-indigo-50 text-indigo-900 font-bold" : "border-slate-200 bg-white text-slate-700";
                      } else {
                        if (isCorrect) btnClass += "border-green-500 bg-green-50 text-green-900 font-bold";
                        else if (isSelected && !isCorrect) btnClass += "border-red-500 bg-red-50 text-red-900";
                        else btnClass += "border-slate-200 opacity-40";
                      }
                      return (
                        <button key={oIdx} disabled={showResult}
                          onClick={() => setQuizAnswers(prev => ({...prev, [qIdx]: oIdx}))}
                          className={btnClass}>{opt}</button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
            {quizScore === null ? (
              <button onClick={checkTextQuiz}
                disabled={Object.keys(quizAnswers).length < activeText.questions.length}
                className={`w-full mt-6 py-3.5 rounded-xl font-bold text-sm text-white transition shadow-md ${Object.keys(quizAnswers).length < activeText.questions.length ? 'bg-slate-400 cursor-not-allowed' : 'bg-indigo-700 hover:bg-indigo-800'}`}>
                Cevapları Kontrol Et
              </button>
            ) : (
              <div className="mt-6 card-glass p-5 rounded-2xl shadow border-t-4 border-indigo-600 text-center">
                <h3 className="text-xl font-black text-slate-800 mb-1">Skorun: {quizScore} / {activeText.questions.length}</h3>
                <p className="text-xs text-slate-500 mb-4">{quizScore === activeText.questions.length ? "Mükemmel! Hepsini doğru cevapladın." : "Biraz daha tekrar yapabilirsin."}</p>
                <button onClick={completeTextAndGoBack} className="w-full py-3 bg-indigo-700 hover:bg-indigo-800 text-white rounded-xl font-bold text-sm shadow">
                  Menüye Dön
                </button>
              </div>
            )}
          </div>
        )}

        {/* SAVED WORDS VIEW */}
        {currentView === 'savedWords' && (
          <div className="flex-1 flex flex-col">
            <div className="p-4 card-glass border-b border-slate-200 shrink-0">
              <div className="flex justify-between items-center mb-3">
                <div>
                  <h3 className="font-bold text-slate-800">Kaydedilen Kelimeler</h3>
                  <p className="text-xs text-slate-400 font-medium">{filteredSavedWords.length} kelime listeleniyor</p>
                </div>
                <button onClick={startVocabTest} disabled={filteredSavedWords.length < 3}
                  className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl font-bold text-xs ${filteredSavedWords.length < 3 ? 'bg-slate-200 text-slate-400' : 'bg-indigo-700 text-white shadow'}`}>
                  <span>▶️</span> Test Et
                </button>
              </div>

              {/* Seviye Filtre Butonları */}
              <div className="flex gap-1.5 overflow-x-auto scrollbar-hide py-1">
                {['ALL', 'A1', 'A2', 'B1', 'B2'].map(lvl => {
                  const count = lvl === 'ALL' ? savedWords.length : savedWords.filter(w => w.level === lvl).length;
                  return (
                    <button
                      key={lvl}
                      onClick={() => setWordFilterLevel(lvl)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 transition flex items-center gap-1 ${wordFilterLevel === lvl ? 'bg-indigo-700 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100'}`}
                    >
                      <span>{lvl === 'ALL' ? 'Tümü' : lvl}</span>
                      <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${wordFilterLevel === lvl ? 'bg-indigo-800 text-white' : 'bg-slate-200 text-slate-600'}`}>{count}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Kelime Listesi */}
            <div className="flex-1 p-4 space-y-2.5 overflow-y-auto">
              {filteredSavedWords.length === 0 ? (
                <div className="text-center text-slate-400 mt-16">
                  <p className="text-4xl mb-2">🏷️</p>
                  <p className="text-sm font-medium">Bu seviyede kayıtlı kelime bulunamadı.</p>
                  <p className="text-xs text-slate-400 mt-1">Metin okurken kelimelerin üzerine tıklayarak etiketleyebilirsin.</p>
                </div>
              ) : (
                filteredSavedWords.map((wordObj, idx) => (
                  <div key={idx} className="card-glass p-3.5 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div className="flex items-center gap-3">
                      <span className={`text-[11px] font-black px-2 py-1 rounded-md border ${getBadgeStyle(wordObj.level)}`}>
                        {wordObj.level || 'B1'}
                      </span>
                      <div>
                        <div className="flex items-center gap-2">
                          <h4 className="font-bold text-base text-slate-800">{wordObj.original}</h4>
                          <button onClick={() => speak(wordObj.original)} className="text-xs text-indigo-600">🔊</button>
                        </div>
                        <p className="text-xs text-slate-500 font-medium">{wordObj.translated}</p>
                      </div>
                    </div>
                    <button onClick={() => toggleSaveWord(wordObj, wordObj.level)} className="p-2 text-slate-400 hover:text-red-500 text-sm">✕</button>
                  </div>
                ))
              )}
            </div>
          </div>
        )}

        {/* VOCAB TEST VIEW */}
        {currentView === 'vocabTest' && vocabQuestions.length > 0 && (
          <div className="flex-1 flex flex-col p-6">
            {!vocabTestFinished ? (
              <div className="flex-1 flex flex-col">
                <div className="flex justify-between items-center text-xs font-bold text-slate-400 mb-6">
                  <span>Soru {currentVocabIdx + 1} / {vocabQuestions.length}</span>
                  <span className={`px-2 py-0.5 rounded border text-[10px] ${getBadgeStyle(vocabQuestions[currentVocabIdx]?.level)}`}>
                    {vocabQuestions[currentVocabIdx]?.level || 'B1'}
                  </span>
                </div>
                <div className="flex-1 flex flex-col items-center justify-center mb-6">
                  <span className="text-xs text-indigo-700 font-bold uppercase tracking-wider mb-2">Bu kelimenin anlamı nedir?</span>
                  <h2 className="text-3xl font-black text-slate-800 text-center flex items-center gap-2">
                    {vocabQuestions[currentVocabIdx]?.word || ''}
                    <button onClick={() => speak(vocabQuestions[currentVocabIdx]?.word)} className="text-lg text-indigo-600">🔊</button>
                  </h2>
                </div>
                <div className="space-y-2.5 mb-8">
                  {(vocabQuestions[currentVocabIdx]?.options || []).map((opt, idx) => (
                    <button key={idx} onClick={() => handleVocabAnswer(idx)}
                      className="w-full card-glass p-3.5 rounded-2xl border-2 border-indigo-100 text-base font-semibold text-slate-700 text-center hover:border-indigo-400 active:scale-[0.98] transition shadow-sm">
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="flex-1 flex flex-col items-center justify-center text-center space-y-5">
                <div className="bg-green-100 w-20 h-20 rounded-full flex items-center justify-center shadow-inner">
                  <span className="text-4xl">🎉</span>
                </div>
                <div>
                  <h2 className="text-2xl font-bold text-slate-800 mb-1">Test Tamamlandı!</h2>
                  <p className="text-sm text-slate-600">Puanın: <strong className="text-indigo-700 font-black text-lg">{vocabScore} / {vocabQuestions.length}</strong></p>
                </div>
                <button onClick={() => setCurrentView('savedWords')} className="w-full bg-indigo-700 hover:bg-indigo-800 text-white py-3.5 rounded-xl font-bold text-sm shadow-md">
                  Deftere Dön
                </button>
              </div>
            )}
          </div>
        )}

      </div>

      {/* VIEWPORT-FIXED ÇEVİRİ MODALI (SAYFA BOYUTUNDAN BAĞIMSIZ DOĞRUDAN AKTİF EKRANDA ÇIKAR) */}
      {selectedTranslation && (
        <div className="fixed bottom-3 inset-x-3 max-w-md mx-auto bg-slate-900/98 text-white p-4 rounded-3xl shadow-2xl z-50 border border-slate-700">
          <button
            onClick={() => { setSelectedTranslation(null); setActiveHighlight(null); }}
            className="absolute top-3 right-3 p-1 text-slate-400 hover:text-white text-base"
          >✕</button>

          <div className="mb-3 flex items-center gap-2">
            <span className="text-[10px] font-bold uppercase text-slate-400">Seviye Etiketi:</span>
            <div className="flex gap-1">
              {['A1', 'A2', 'B1', 'B2'].map(lvl => (
                <button
                  key={lvl}
                  onClick={() => setSelectedLevelTag(lvl)}
                  className={`text-[10px] font-black px-2 py-0.5 rounded border transition ${selectedLevelTag === lvl ? 'bg-indigo-600 text-white border-indigo-400' : 'bg-slate-800 text-slate-400 border-slate-700'}`}
                >
                  {lvl}
                </button>
              ))}
            </div>
          </div>

          {selectedTranslation.phrase && (
            <div className="mb-3 pb-3 border-b border-slate-800 pr-6">
              <div className="flex items-center gap-2 mb-0.5">
                <span className="text-[10px] text-indigo-400 font-bold uppercase">Kelime Grubu</span>
                <button onClick={() => speak(selectedTranslation.phrase.original)} className="text-xs">🔊</button>
              </div>
              <div className="text-lg font-bold text-white leading-snug">{selectedTranslation.phrase.original}</div>
              <div className="text-sm text-indigo-200 mb-2 font-medium">{selectedTranslation.phrase.translated}</div>
              <button
                onClick={() => toggleSaveWord(selectedTranslation.phrase, selectedLevelTag)}
                className={`text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition ${isWordSaved(selectedTranslation.phrase.original) ? 'bg-indigo-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}
              >
                {isWordSaved(selectedTranslation.phrase.original) ? `⭐ [${getSavedWordLevel(selectedTranslation.phrase.original) || selectedLevelTag}] Kaydedildi` : `🔖 ${selectedLevelTag} Olarak Kaydet`}
              </button>
            </div>
          )}

          <div className="pr-6">
            <div className="flex items-center gap-2 mb-0.5">
              <span className="text-[10px] text-slate-400 font-bold uppercase">
                {selectedTranslation.phrase ? "Tıkladığınız Kelime" : "Kelime Çevirisi"}
              </span>
              <button onClick={() => speak(selectedTranslation.word.original)} className="text-xs">🔊</button>
            </div>
            <div className="text-base font-bold text-slate-100">{selectedTranslation.word.original}</div>
            <div className="text-xs text-slate-400 mb-2 font-medium">{selectedTranslation.word.translated}</div>
            <button
              onClick={() => toggleSaveWord(selectedTranslation.word, selectedLevelTag)}
              className={`text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition ${isWordSaved(selectedTranslation.word.original) ? 'bg-indigo-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}
            >
              {isWordSaved(selectedTranslation.word.original) ? `⭐ [${getSavedWordLevel(selectedTranslation.word.original) || selectedLevelTag}] Kaydedildi` : `🔖 ${selectedLevelTag} Olarak Kaydet`}
            </button>
          </div>
        </div>
      )}

    </div>
  );
}

const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
</script>
</body>
</html>
