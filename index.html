    function App() {
      const [currentView, setCurrentView] = useState('home'); 
      const [selectedLevel, setSelectedLevel] = useState(null);
      const [lengthFilter, setLengthFilter] = useState('all'); 
      const [activeText, setActiveText] = useState(null);
      
      const [selectedTranslation, setSelectedTranslation] = useState(null);
      const [activeHighlight, setActiveHighlight] = useState(null);
      const [showFullTranslation, setShowFullTranslation] = useState(false);
      const [revealedSentences, setRevealedSentences] = useState({});
      
      const [completedTexts, setCompletedTexts] = useState([]);
      const [savedWords, setSavedWords] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);
      
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizScore, setQuizScore] = useState(null);
      
      const [vocabQuestions, setVocabQuestions] = useState([]);
      const [currentVocabIdx, setCurrentVocabIdx] = useState(0);
      const [vocabScore, setVocabScore] = useState(0);
      const [vocabTestFinished, setVocabTestFinished] = useState(false);

      const timeoutRef = useRef(null);

      useEffect(() => {
        if (toastMessage) {
          const timer = setTimeout(() => setToastMessage(null), 3000);
          return () => clearTimeout(timer);
        }
      }, [toastMessage]);

      const cleanWord = (word) => {
        if (!word) return '';
        return word.replace(/[.,!?]/g, '').toLowerCase();
      };

      const speakSentence = (text) => {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.onerror = () => setToastMessage("Ses çalınırken bir hata oluştu.");
            window.speechSynthesis.speak(utterance);
          } else {
            setToastMessage("Tarayıcınız sesli okuma özelliğini desteklemiyor.");
          }
        } catch (error) {
           setToastMessage("Ses motoruna erişilemedi.");
        }
      };

      const handleWordClick = (word, index, sentenceWords, sentenceId) => {
        const cleanWords = sentenceWords.map(w => cleanWord(w));
        const clickedCleanWord = cleanWords[index];
        
        const singleWordData = {
            original: clickedCleanWord,
            translated: dictionary[clickedCleanWord] || "(Anlamı bulunamadı)"
        };

        let foundPhraseData = null;
        let matchedIndices = [index];

        for (let length = 3; length >= 2; length--) {
            for (let start = Math.max(0, index - length + 1); start <= index; start++) {
                if (start + length <= cleanWords.length) {
                    const phraseCandidate = cleanWords.slice(start, start + length).join(' ');
                    if (dictionary[phraseCandidate]) {
                         matchedIndices = Array.from({length}, (_, i) => start + i);
                         foundPhraseData = {
                             original: sentenceWords.slice(start, start + length).join(' '),
                             translated: dictionary[phraseCandidate]
                         };
                         break;
                    }
                }
            }
            if (foundPhraseData) break;
        }

        setSelectedTranslation({ word: singleWordData, phrase: foundPhraseData });
        setActiveHighlight({ sentenceId, indices: matchedIndices });
        if (timeoutRef.current) clearTimeout(timeoutRef.current);
      };

      const toggleSentenceTranslation = (sentenceId) => {
        setRevealedSentences(prev => ({ ...prev, [sentenceId]: !prev[sentenceId] }));
      };

      const startReading = (text) => {
        setActiveText(text);
        setCurrentView('reading');
        setRevealedSentences({});
        setShowFullTranslation(false);
        setSelectedTranslation(null);
        setActiveHighlight(null);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      };

      const goBack = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (currentView === 'reading' || currentView === 'textQuiz') {
          setCurrentView('levels');
          setActiveText(null);
          setQuizScore(null);
          setQuizAnswers({});
        } else if (currentView === 'levels' || currentView === 'savedWords' || currentView === 'vocabTest') {
          setCurrentView('home');
          setSelectedLevel(null);
          setLengthFilter('all');
        }
      };

      const handleFinishReading = () => {
        if (activeText?.questions && activeText.questions.length > 0) {
          setCurrentView('textQuiz');
          setQuizAnswers({});
          setQuizScore(null);
        } else {
          completeTextAndGoBack();
        }
      };

      const completeTextAndGoBack = () => {
        if (activeText && !completedTexts.includes(activeText.id)) {
          setCompletedTexts(prev => [...prev, activeText.id]);
        }
        setTimeout(() => { goBack(); }, 150);
      };

      const checkTextQuiz = () => {
        if (!activeText || !activeText.questions) return;
        
        let score = 0;
        activeText.questions.forEach((q, idx) => {
          if (quizAnswers[idx] === q.answer) score++;
        });
        setQuizScore(score);
        
        if (score === activeText.questions.length && !completedTexts.includes(activeText.id)) {
           setCompletedTexts(prev => [...prev, activeText.id]);
        }
      };

      const toggleSaveWord = (wordObj) => {
        setSavedWords(prev => {
          const isSaved = prev.some(w => w.original === wordObj.original);
          if (isSaved) return prev.filter(w => w.original !== wordObj.original);
          return [...prev, wordObj];
        });
      };

      const isWordSaved = (wordStr) => savedWords.some(w => w.original === wordStr);

      const startVocabTest = () => {
        if (savedWords.length < 3) {
          setToastMessage("Test için en az 3 kelime kaydetmelisiniz.");
          return;
        }
        const allTranslations = Object.values(dictionary).filter(v => v !== undefined);
        const questions = savedWords.map(word => {
          const correct = word.translated;
          let wrongOptions = [];
          while(wrongOptions.length < 2) {
            const randomTr = allTranslations[Math.floor(Math.random() * allTranslations.length)];
            if (randomTr && randomTr !== correct && !wrongOptions.includes(randomTr)) {
              wrongOptions.push(randomTr);
            }
          }
          const options = [correct, ...wrongOptions].sort(() => Math.random() - 0.5);
          return { word: word.original, options: options, correctIndex: options.indexOf(correct) };
        });

        setVocabQuestions(questions.sort(() => Math.random() - 0.5).slice(0, 10));
        setCurrentVocabIdx(0);
        setVocabScore(0);
        setVocabTestFinished(false);
        setCurrentView('vocabTest');
      };

      const handleVocabAnswer = (selectedIndex) => {
        const isCorrect = selectedIndex === vocabQuestions[currentVocabIdx]?.correctIndex;
        if (isCorrect) setVocabScore(prev => prev + 1);
        setTimeout(() => {
          if (currentVocabIdx + 1 < vocabQuestions.length) setCurrentVocabIdx(prev => prev + 1);
          else setVocabTestFinished(true);
        }, 500);
      };

      const filteredTexts = texts.filter(t => {
        if (t.level !== selectedLevel) return false;
        if (lengthFilter === 'all') return true;
        return t.length === lengthFilter;
      });

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex justify-center w-full h-full pb-4">
          <div className="w-full max-w-md bg-white shadow-xl min-h-screen relative flex flex-col">
            
            <div className="bg-indigo-600 text-white p-4 flex items-center shadow-md shrink-0">
              {currentView !== 'home' && (
                <button onClick={goBack} className="p-2 mr-2 hover:bg-indigo-500 rounded-full transition text-xl">⬅️</button>
              )}
              <h1 className="text-lg font-bold flex-1 text-center truncate">
                {currentView === 'home' && "İngilizce Öğren"}
                {currentView === 'levels' && `${selectedLevel} Metinleri`}
                {currentView === 'reading' && activeText?.title}
                {currentView === 'textQuiz' && "Okuma Sınavı"}
                {currentView === 'savedWords' && "Kelime Defterim"}
                {currentView === 'vocabTest' && "Kelime Testi"}
              </h1>
              {currentView !== 'home' && <div className="w-10"></div>}
            </div>

            {toastMessage && (
                <div className="absolute top-16 left-4 right-4 bg-orange-500 text-white p-3 rounded-xl shadow-lg z-50 flex items-start gap-2">
                    <span className="text-xl shrink-0 mt-0.5">⚠️</span>
                    <p className="text-sm font-medium">{toastMessage}</p>
                </div>
            )}

            {currentView === 'home' && (
              <div className="flex-1 p-6 flex flex-col items-center justify-center space-y-6">
                <div className="text-center mb-4 mt-4">
                  <div className="bg-indigo-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span className="text-5xl">🌐</span>
                  </div>
                  <h2 className="text-2xl font-bold text-slate-800 mb-2">Seviyeni Seç</h2>
                </div>
                
                <div className="w-full space-y-3">
                  {levels.map(level => (
                    <button key={level} onClick={() => { setSelectedLevel(level); setCurrentView('levels'); }} className="w-full bg-white border-2 border-indigo-100 p-4 rounded-2xl flex items-center justify-between hover:bg-indigo-50 shadow-sm">
                      <span className="font-bold text-xl text-indigo-900">{level} Seviyesi</span>
                      <span className="text-xl rotate-180 text-indigo-400">⬅️</span>
                    </button>
                  ))}
                </div>

                <button onClick={() => setCurrentView('savedWords')} className="w-full mt-4 bg-orange-50 border-2 border-orange-200 p-4 rounded-2xl flex items-center justify-between hover:border-orange-500 shadow-sm text-orange-800">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">📚</span>
                    <span className="font-bold text-lg">Kelime Defterim</span>
                  </div>
                  <div className="bg-orange-600 text-white text-xs font-bold px-2 py-1 rounded-full">{savedWords.length}</div>
                </button>
              </div>
            )}

            {currentView === 'levels' && (
              <div className="flex-1 p-4 space-y-4 overflow-y-auto">
                {texts.filter(t => t.level === selectedLevel).map(text => (
                  <button key={text.id} onClick={() => startReading(text)} className="w-full text-left bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-center">
                    <div className="bg-indigo-100 text-indigo-600 p-3 rounded-xl shrink-0 flex items-center justify-center w-12 h-12">
                      <span className="text-2xl">📄</span>
                    </div>
                    <div className="flex-1">
                      <h3 className="font-bold text-lg leading-tight mb-1 text-slate-800">{text.title}</h3>
                      <span className="text-xs text-slate-400 font-medium">{text.sentences.length} Cümle</span>
                    </div>
                  </button>
                ))}
              </div>
            )}

            {currentView === 'reading' && activeText && (
              <div className="flex-1 flex flex-col relative pb-24">
                <div className="p-5 flex-1 overflow-y-auto space-y-6">
                  {activeText.sentences.map((sentence) => {
                    const sentenceWords = sentence.eng.split(' ');
                    return (
                    <div key={sentence.id} className="relative">
                      <div className="text-lg leading-relaxed text-slate-800 flex flex-wrap items-center gap-y-2">
                        <div className="flex-1">
                          {sentenceWords.map((word, idx) => (
                            <span key={idx}>
                              <button onClick={() => handleWordClick(word, idx, sentenceWords)} className="rounded px-0.5 hover:bg-indigo-100">
                                {word}
                              </button>{' '}
                            </span>
                          ))}
                        </div>
                        <button onClick={() => setRevealedSentences(prev => ({ ...prev, [sentence.id]: !prev[sentence.id] }))} className="w-8 h-8 rounded-full bg-slate-200 text-center ml-2">🌐</button>
                      </div>
                      {revealedSentences[sentence.id] && (
                        <div className="mt-2 p-3 bg-indigo-50 border-l-4 border-indigo-500 text-sm rounded-r-lg">{sentence.tr}</div>
                      )}
                    </div>
                  )})}
                </div>
              </div>
            )}

            {selectedWord && (
              <div className="absolute bottom-10 left-4 right-4 bg-slate-900 text-white p-5 rounded-3xl shadow-2xl z-50">
                <button onClick={() => setSelectedWord(null)} className="absolute top-4 right-4 p-2 text-xl">❌</button>
                <div className="text-[10px] text-slate-400 mb-1 font-bold uppercase">Kelime Çevirisi</div>
                <div className="text-lg font-semibold mb-0.5">{selectedWord.original}</div>
                <div className="text-base text-slate-400">{selectedWord.translated}</div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
