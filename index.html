function App() {
  // localStorage ile kalıcı state'ler
  const [completedTexts, setCompletedTexts] = useState(() => {
    try { return JSON.parse(localStorage.getItem('completedTexts') || '[]'); } 
    catch { return []; }
  });
  const [savedWords, setSavedWords] = useState(() => {
    try { return JSON.parse(localStorage.getItem('savedWords') || '[]'); } 
    catch { return []; }
  });

  // Diğer state'ler
  const [currentView, setCurrentView] = useState('home');
  const [selectedLevel, setSelectedLevel] = useState(null);
  const [lengthFilter, setLengthFilter] = useState('all');
  const [activeText, setActiveText] = useState(null);
  const [selectedTranslation, setSelectedTranslation] = useState(null);
  const [activeHighlight, setActiveHighlight] = useState(null);
  const [showFullTranslation, setShowFullTranslation] = useState(false);
  const [revealedSentences, setRevealedSentences] = useState({});
  const [toastMessage, setToastMessage] = useState(null);
  const [quizAnswers, setQuizAnswers] = useState({});
  const [quizScore, setQuizScore] = useState(null);
  const [vocabQuestions, setVocabQuestions] = useState([]);
  const [currentVocabIdx, setCurrentVocabIdx] = useState(0);
  const [vocabScore, setVocabScore] = useState(0);
  const [vocabTestFinished, setVocabTestFinished] = useState(false);

  // localStorage'a kaydet
  useEffect(() => {
    localStorage.setItem('completedTexts', JSON.stringify(completedTexts));
  }, [completedTexts]);

  useEffect(() => {
    localStorage.setItem('savedWords', JSON.stringify(savedWords));
  }, [savedWords]);

  useEffect(() => {
    if (toastMessage) {
      const timer = setTimeout(() => setToastMessage(null), 3000);
      return () => clearTimeout(timer);
    }
  }, [toastMessage]);

  const cleanWord = (word) => {
    if (!word) return '';
    return word.replace(/[.,!?']/g, '').toLowerCase();
  };

  const handleWordClick = (word, index, sentenceWords, sentenceId) => {
    const cleanWords = sentenceWords.map(w => cleanWord(w));
    const clickedCleanWord = cleanWords[index];

    const singleWordData = {
      original: clickedCleanWord,
      translated: dictionary[clickedCleanWord] || "(Anlamı bulunamadı)"
    };

    let foundPhraseData = null;
    let matchedIndices = [index];

    for (let len = 3; len >= 2; len--) {
      for (let start = Math.max(0, index - len + 1); start <= index; start++) {
        if (start + len <= cleanWords.length) {
          const phraseCandidate = cleanWords.slice(start, start + len).join(' ');
          if (dictionary[phraseCandidate]) {
            matchedIndices = Array.from({length: len}, (_, i) => start + i);
            foundPhraseData = {
              original: sentenceWords.slice(start, start + len).join(' '),
              translated: dictionary[phraseCandidate]
            };
            break;
          }
        }
      }
      if (foundPhraseData) break;
    }

    setSelectedTranslation({ word: singleWordData, phrase: foundPhraseData });
    setActiveHighlight({ sentenceId, indices: matchedIndices });
  };

  const startReading = (text) => {
    setActiveText(text);
    setCurrentView('reading');
    setRevealedSentences({});
    setShowFullTranslation(false);
    setSelectedTranslation(null);
    setActiveHighlight(null);
  };

  const goBack = () => {
    if (currentView === 'reading' || currentView === 'textQuiz') {
      setCurrentView('levels');
      setActiveText(null);
      setQuizScore(null);
      setQuizAnswers({});
      setSelectedTranslation(null);
      setActiveHighlight(null);
    } else if (currentView === 'levels' || currentView === 'savedWords' || currentView === 'vocabTest') {
      setCurrentView('home');
      setSelectedLevel(null);
      setLengthFilter('all');
    }
  };

  const handleFinishReading = () => {
    if (activeText && activeText.questions && activeText.questions.length > 0) {
      setCurrentView('textQuiz');
      setQuizAnswers({});
      setQuizScore(null);
      setSelectedTranslation(null);
    } else {
      completeTextAndGoBack();
    }
  };

  const completeTextAndGoBack = () => {
    if (activeText && !completedTexts.includes(activeText.id)) {
      setCompletedTexts(prev => [...prev, activeText.id]);
    }
    setTimeout(() => { goBack(); }, 100);
  };

  const checkTextQuiz = () => {
    if (!activeText || !activeText.questions) return;
    let score = 0;
    activeText.questions.forEach((q, idx) => {
      if (quizAnswers[idx] === q.answer) score++;
    });
    setQuizScore(score);
    if (score === activeText.questions.length && !completedTexts.includes(activeText.id)) {
      setCompletedTexts(prev => [...prev, activeText.id]);
    }
  };

  const toggleSaveWord = (wordObj) => {
    setSavedWords(prev => {
      const isSaved = prev.some(w => w.original === wordObj.original);
      if (isSaved) return prev.filter(w => w.original !== wordObj.original);
      return [...prev, wordObj];
    });
  };

  const isWordSaved = (wordStr) => savedWords.some(w => w.original === wordStr);

  const startVocabTest = () => {
    if (savedWords.length < 3) {
      setToastMessage("Test için en az 3 kelime kaydetmelisiniz.");
      return;
    }
    const allTranslations = Object.values(dictionary).filter(v => v);
    const questions = savedWords.map(word => {
      const correct = word.translated;
      let wrongOptions = [];
      while (wrongOptions.length < 2) {
        const randomTr = allTranslations[Math.floor(Math.random() * allTranslations.length)];
        if (randomTr && randomTr !== correct && !wrongOptions.includes(randomTr)) {
          wrongOptions.push(randomTr);
        }
      }
      const options = [correct, ...wrongOptions].sort(() => Math.random() - 0.5);
      return { word: word.original, options, correctIndex: options.indexOf(correct) };
    });
    setVocabQuestions(questions.sort(() => Math.random() - 0.5).slice(0, 10));
    setCurrentVocabIdx(0);
    setVocabScore(0);
    setVocabTestFinished(false);
    setCurrentView('vocabTest');
  };

  const handleVocabAnswer = (selectedIndex) => {
    const isCorrect = vocabQuestions[currentVocabIdx] && (selectedIndex === vocabQuestions[currentVocabIdx].correctIndex);
    if (isCorrect) setVocabScore(prev => prev + 1);
    setTimeout(() => {
      if (currentVocabIdx + 1 < vocabQuestions.length) setCurrentVocabIdx(prev => prev + 1);
      else setVocabTestFinished(true);
    }, 400);
  };

  const filteredTexts = texts.filter(t => {
    if (t.level !== selectedLevel) return false;
    if (lengthFilter === 'all') return true;
    return t.length === lengthFilter;
  });

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 flex justify-center w-full">
      <div className="w-full max-w-md bg-white shadow-xl min-h-screen relative flex flex-col">

        {/* Header */}
        <div className="bg-indigo-600 text-white p-4 flex items-center shadow-md shrink-0 sticky top-0 z-40">
          {currentView !== 'home' && (
            <button onClick={goBack} className="p-2 mr-2 hover:bg-indigo-500 rounded-full transition text-xl">⬅️</button>
          )}
          <h1 className="text-lg font-bold flex-1 text-center truncate">
            {currentView === 'home' && "İngilizce Öğren"}
            {currentView === 'levels' && `${selectedLevel} Metinleri`}
            {currentView === 'reading' && (activeText ? activeText.title : '')}
            {currentView === 'textQuiz' && "Okuma Sınavı"}
            {currentView === 'savedWords' && "Kelime Defterim"}
            {currentView === 'vocabTest' && "Kelime Testi"}
          </h1>
          {currentView !== 'home' && <div className="w-10"></div>}
        </div>

        {/* Toast */}
        {toastMessage && (
          <div className="fixed top-20 left-4 right-4 max-w-md mx-auto bg-orange-500 text-white p-3 rounded-xl shadow-lg z-50 flex items-start gap-2">
            <span className="text-xl shrink-0">⚠️</span>
            <p className="text-sm font-medium">{toastMessage}</p>
          </div>
        )}

        {/* HOME */}
        {currentView === 'home' && (
          <div className="flex-1 p-6 flex flex-col items-center justify-center space-y-6">
            <div className="text-center mb-4">
              <div className="bg-indigo-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4">
                <span className="text-5xl">🌐</span>
              </div>
              <h2 className="text-2xl font-bold text-slate-800 mb-2">Seviyeni Seç</h2>
            </div>
            <div className="w-full space-y-3">
              {levels.map(level => (
                <button key={level} onClick={() => { setSelectedLevel(level); setCurrentView('levels'); }}
                  className="w-full bg-white border-2 border-indigo-100 p-4 rounded-2xl flex items-center justify-between hover:bg-indigo-50 shadow-sm">
                  <span className="font-bold text-xl text-indigo-900">{level} Seviyesi</span>
                  <span className="text-xl rotate-180 text-indigo-400">⬅️</span>
                </button>
              ))}
            </div>
            <button onClick={() => setCurrentView('savedWords')}
              className="w-full mt-4 bg-orange-50 border-2 border-orange-200 p-4 rounded-2xl flex items-center justify-between hover:border-orange-500 shadow-sm text-orange-800">
              <div className="flex items-center gap-3">
                <span className="text-2xl">📚</span>
                <span className="font-bold text-lg">Kelime Defterim</span>
              </div>
              <div className="bg-orange-600 text-white text-xs font-bold px-2 py-1 rounded-full">{savedWords.length}</div>
            </button>
          </div>
        )}

        {/* LEVELS */}
        {currentView === 'levels' && (
          <div className="flex-1 p-4 space-y-4 overflow-y-auto pb-6">
            {filteredTexts.map(text => {
              const isCompleted = completedTexts.includes(text.id);
              const lengthColor = text.length === 'short' ? "bg-blue-100 text-blue-700" : text.length === 'medium' ? "bg-amber-100 text-amber-700" : "bg-purple-100 text-purple-700";
              const lengthLabel = text.length === 'short' ? "Kısa" : text.length === 'medium' ? "Orta" : "Uzun";
              return (
                <button key={text.id} onClick={() => startReading(text)}
                  className={`w-full text-left bg-white p-5 rounded-2xl shadow-sm border flex gap-4 items-center hover:shadow-md active:scale-[0.98] transition ${isCompleted ? 'border-green-200 bg-green-50' : 'border-slate-100'}`}>
                  <div className={`${isCompleted ? 'bg-green-100 text-green-600' : 'bg-indigo-100 text-indigo-600'} p-3 rounded-xl shrink-0 flex items-center justify-center w-12 h-12`}>
                    <span className="text-2xl">{isCompleted ? '✅' : '📄'}</span>
                  </div>
                  <div className="flex-1">
                    <h3 className={`font-bold text-lg leading-tight mb-1 ${isCompleted ? 'text-green-900' : 'text-slate-800'}`}>{text.title}</h3>
                    <div className="flex items-center gap-2 mt-1">
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${lengthColor}`}>{lengthLabel}</span>
                      <span className="text-xs text-slate-400 font-medium">{text.sentences.length} Cümle</span>
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        )}

        {/* READING */}
        {currentView === 'reading' && activeText && (
          <div className="flex-1 flex flex-col relative">
            <div className="p-5 flex-1 overflow-y-auto space-y-6 pb-32">
              {activeText.sentences.map((sentence) => {
                const sentenceWords = sentence.eng.split(' ');
                const isHighlighted = activeHighlight && activeHighlight.sentenceId === sentence.id;
                return (
                  <div key={sentence.id} className="relative">
                    <div className="text-lg leading-relaxed text-slate-800 flex flex-wrap items-center gap-y-2">
                      <div className="flex-1">
                        {sentenceWords.map((word, idx) => {
                          const isWordHighlighted = isHighlighted && activeHighlight.indices.includes(idx);
                          return (
                            <span key={idx}>
                              <button
                                onClick={() => handleWordClick(word, idx, sentenceWords, sentence.id)}
                                className={`rounded px-0.5 hover:bg-indigo-100 transition ${isWordHighlighted ? 'word-highlight' : ''}`}
                              >
                                {word}
                              </button>{' '}
                            </span>
                          );
                        })}
                      </div>
                      <button
                        onClick={() => setRevealedSentences(prev => ({ ...prev, [sentence.id]: !prev[sentence.id] }))}
                        className="w-8 h-8 rounded-full bg-slate-200 text-center ml-2 shrink-0"
                      >🌐</button>
                    </div>
                    {(revealedSentences[sentence.id] || showFullTranslation) && (
                      <div className="mt-2 p-3 bg-indigo-50 border-l-4 border-indigo-500 text-sm rounded-r-lg text-slate-700">
                        {sentence.tr}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Alt butonlar */}
            <div className="absolute bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] flex gap-3 z-30">
              <button
                onClick={() => setShowFullTranslation(!showFullTranslation)}
                className={`flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2 ${showFullTranslation ? 'bg-slate-200 text-slate-700' : 'bg-indigo-100 text-indigo-700'}`}
              >
                <span className="text-xl">🌐</span> {showFullTranslation ? "Gizle" : "Tam Çeviri"}
              </button>
              <button onClick={handleFinishReading} className="flex-[1.5] py-3 rounded-xl font-bold flex items-center justify-center gap-2 bg-green-500 text-white shadow-lg">
                <span className="text-xl">✅</span> Sınava Geç
              </button>
            </div>
          </div>
        )}

        {/* QUIZ */}
        {currentView === 'textQuiz' && activeText && activeText.questions && (
          <div className="flex-1 p-6 bg-slate-50 overflow-y-auto pb-10">
            <div className="text-center mb-6">
              <h2 className="text-xl font-bold text-slate-800">Okuduğunu Anlama</h2>
            </div>
            <div className="space-y-8">
              {activeText.questions.map((q, qIdx) => (
                <div key={qIdx} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                  <p className="font-bold text-lg text-slate-800 mb-4">{qIdx + 1}. {q.q}</p>
                  <div className="space-y-2">
                    {q.options.map((opt, oIdx) => {
                      const isSelected = quizAnswers[qIdx] === oIdx;
                      const showResult = quizScore !== null;
                      const isCorrect = q.answer === oIdx;
                      let btnClass = "w-full text-left p-3 rounded-xl border-2 transition-all ";
                      if (!showResult) {
                        btnClass += isSelected ? "border-indigo-500 bg-indigo-50 text-indigo-700" : "border-slate-100 text-slate-600";
                      } else {
                        if (isCorrect) btnClass += "border-green-500 bg-green-50 text-green-700";
                        else if (isSelected && !isCorrect) btnClass += "border-red-500 bg-red-50 text-red-700";
                        else btnClass += "border-slate-100 opacity-50";
                      }
                      return (
                        <button key={oIdx} disabled={showResult}
                          onClick={() => setQuizAnswers(prev => ({...prev, [qIdx]: oIdx}))}
                          className={btnClass}>{opt}</button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
            {quizScore === null ? (
              <button onClick={checkTextQuiz}
                disabled={Object.keys(quizAnswers).length < activeText.questions.length}
                className={`w-full mt-8 py-4 rounded-xl font-bold text-white transition-all ${Object.keys(quizAnswers).length < activeText.questions.length ? 'bg-slate-300 cursor-not-allowed' : 'bg-indigo-600 shadow-lg'}`}>
                Cevapları Kontrol Et
              </button>
            ) : (
              <div className="mt-8 bg-white p-6 rounded-2xl shadow-md border-t-4 border-indigo-500 text-center">
                <h3 className="text-2xl font-black text-slate-800 mb-2">Sonuç: {quizScore} / {activeText.questions.length}</h3>
                <button onClick={completeTextAndGoBack} className="w-full py-3 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-xl font-bold mt-4">
                  Menüye Dön
                </button>
              </div>
            )}
          </div>
        )}

        {/* SAVED WORDS */}
        {currentView === 'savedWords' && (
          <div className="flex-1 flex flex-col bg-slate-50">
            <div className="p-4 bg-white border-b border-slate-200 flex justify-between items-center shrink-0">
              <div>
                <h3 className="font-bold text-slate-800">Kaydedilen Kelimeler</h3>
                <p className="text-xs text-slate-400">{savedWords.length} kelime</p>
              </div>
              <button onClick={startVocabTest} disabled={savedWords.length < 3}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm ${savedWords.length < 3 ? 'bg-slate-200 text-slate-400' : 'bg-indigo-600 text-white shadow-md'}`}>
                ▶️ Test Et
              </button>
            </div>
            <div className="flex-1 p-5 space-y-3 overflow-y-auto">
              {savedWords.length === 0 ? (
                <div className="text-center text-slate-400 mt-16">
                  <p className="text-4xl mb-3">📚</p>
                  <p>Henüz kelime kaydetmediniz.</p>
                  <p className="text-sm mt-1">Metinlerde kelimelere tıklayıp kaydedebilirsin.</p>
                </div>
              ) : (
                savedWords.map((wordObj, idx) => (
                  <div key={idx} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div>
                      <h4 className="font-bold text-lg text-indigo-900">{wordObj.original}</h4>
                      <p className="text-slate-600">{wordObj.translated}</p>
                    </div>
                    <button onClick={() => toggleSaveWord(wordObj)} className="p-2 text-red-400 text-lg hover:bg-red-50 rounded-full">❌</button>
                  </div>
                ))
              )}
            </div>
          </div>
        )}

        {/* VOCAB TEST */}
        {currentView === 'vocabTest' && vocabQuestions.length > 0 && (
          <div className="flex-1 flex flex-col p-6 bg-slate-50">
            {!vocabTestFinished ? (
              <div className="flex-1 flex flex-col">
                <div className="text-center text-sm font-bold text-slate-400 mb-8">
                  Soru {currentVocabIdx + 1} / {vocabQuestions.length}
                </div>
                <div className="flex-1 flex flex-col items-center justify-center mb-8">
                  <span className="text-sm text-indigo-500 font-semibold uppercase tracking-wider mb-2">Bu kelimenin anlamı nedir?</span>
                  <h2 className="text-4xl font-black text-slate-800 text-center">
                    {vocabQuestions[currentVocabIdx]?.word || ''}
                  </h2>
                </div>
                <div className="space-y-3 mb-10">
                  {(vocabQuestions[currentVocabIdx]?.options || []).map((opt, idx) => (
                    <button key={idx} onClick={() => handleVocabAnswer(idx)}
                      className="w-full bg-white p-4 rounded-2xl border-2 border-indigo-100 text-lg font-semibold text-slate-700 text-center hover:border-indigo-400 active:scale-[0.98] transition">
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="flex-1 flex flex-col items-center justify-center text-center space-y-6">
                <div className="bg-green-100 w-24 h-24 rounded-full flex items-center justify-center">
                  <span className="text-5xl">✅</span>
                </div>
                <div>
                  <h2 className="text-3xl font-bold text-slate-800 mb-2">Test Bitti!</h2>
                  <p className="text-lg text-slate-600">Puanın: <strong>{vocabScore} / {vocabQuestions.length}</strong></p>
                </div>
                <button onClick={goBack} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold mt-4">
                  Deftere Dön
                </button>
              </div>
            )}
          </div>
        )}

        {/* ÇEVİRİ KUTUSU - FIXED */}
        {selectedTranslation && (
          <div className="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white p-5 rounded-3xl shadow-2xl z-50 border border-slate-700">
            <button
              onClick={() => { setSelectedTranslation(null); setActiveHighlight(null); }}
              className="absolute top-3 right-3 p-1.5 text-slate-400 hover:text-white text-lg"
            >✕</button>

            {selectedTranslation.phrase && (
              <div className="mb-4 pr-8">
                <div className="text-[10px] text-indigo-400 mb-1 font-bold uppercase tracking-wider">Kelime Grubu</div>
                <div className="text-xl font-bold text-white mb-0.5">{selectedTranslation.phrase.original}</div>
                <div className="text-lg text-indigo-200 leading-tight mb-2">{selectedTranslation.phrase.translated}</div>
                <button
                  onClick={() => toggleSaveWord(selectedTranslation.phrase)}
                  className="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg flex items-center gap-1.5"
                >
                  {isWordSaved(selectedTranslation.phrase.original) ? '⭐ Kaydedildi' : '🔖 Kaydet'}
                </button>
              </div>
            )}

            <div className="pr-8">
              <div className="text-[10px] text-slate-400 mb-1 font-bold uppercase tracking-wider">
                {selectedTranslation.phrase ? "Tıkladığınız Kelime" : "Kelime Çevirisi"}
              </div>
              <div className="text-lg font-semibold text-slate-200 mb-0.5">{selectedTranslation.word.original}</div>
              <div className="text-base text-slate-400 leading-tight mb-2">{selectedTranslation.word.translated}</div>
              <button
                onClick={() => toggleSaveWord(selectedTranslation.word)}
                className="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg flex items-center gap-1.5"
              >
                {isWordSaved(selectedTranslation.word.original) ? '⭐ Kaydedildi' : '🔖 Kaydet'}
              </button>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
</script>
</body>
</html>
